# 知道 KnowAtlas 配置示例 —— 复制为 config/knowatlas.toml 后按本机填写
# 铁律：凭证一律只存"环境变量名"（*_env），密钥本体永不入配置、不入仓库、不入日志
# 校验规则：任何 enabled = true 的源必须有非空路径/凭证，否则启动报 ConfigError
#
# 通用语法说明（TOML 格式）：
# - 方括号 [xxx] 是"节"（一个知识源/一个功能块），节内的 xxx = yyy 是该节的配置项
# - 数组值（可填多个）写法：roots = ["D:/资料/百卓", "D:/笔记"] —— 多个值用逗号分开
#   单个值也建议写成数组：roots = ["D:/资料/百卓"]
# - 引号内的路径用正斜杠 /（Windows 也认），不要用单个反斜杠 \
# - true/false 是开关；enabled = true 表示该源启用，启动校验会检查必填项非空

[general]
db_path      = "data/knowledge.db"   # SQLite 库文件位置（相对项目根，一般不用改）
content_root = "data/content"        # 可选；大正文外置时启用
backup_dir   = "data/backups"        # 备份输出目录（快照文件名 knowledge-日期时间.db）
# 同步前自动快照（VACUUM INTO 一致性快照，WAL 安全）；契约=没快照不同步——快照失败会
# 中断同步（保证任何写入前都有恢复点）；确认不需要可设 false 关闭（风险自担）
backup_on_sync = true
backup_keep  = 10                    # 快照轮换保留份数（超出删最旧；0=不轮换只增不减）
# 快照节流：距上次快照不足该小时数则跳过（VACUUM INTO 是全库重建，大库有成本；
# ksync 频繁跑时不必每次全量重建）；kbackup --no-throttle 可强制
backup_min_interval_hours = 24
log_level    = "INFO"                # 日志级别：DEBUG / INFO / WARNING / ERROR
server_host  = "127.0.0.1"           # Web 服务只监听本机（安全约束，不建议改 0.0.0.0）
server_port  = 8420                  # Web 服务端口

[web]                                  # 本地服务安全（H5 五条约束）
# 写操作令牌的环境变量"名"（不是令牌本体）。
# 不设该环境变量时，serve 启动会自动生成一次会话令牌并打印在日志里，照着粘贴即可；
# 想固定令牌就自己设环境变量：值自己定，任意非空字符串均可，建议 20 位以上随机串
# （PowerShell 永久设置：setx KNOWATLAS_WEB_TOKEN "你的口令" —— 设完重开终端再启动 serve）。
# 两个容易踩的坑（都会让网页写操作报「写操作需 token 头」）：
#   ① 设完环境变量必须重开终端并重启 serve —— serve 只在启动时读一次；
#   ② 同名变量在"系统级/用户级"只能有一处：用户级优先，两处都设时以用户级为准，
#      另一处设了不算数。serve 启动日志会打印"指纹"，网页报错时也显示服务端指纹，
#      两边一致才说明配成了。
token_env    = "KNOWATLAS_WEB_TOKEN"

[llm]                                  # 语义分类用的大模型（OpenAI 兼容接口均可接）
# 只在语义判断时调用（L1 先验/L2 规则命中不消耗 LLM）；key 未设则静默跳过，不影响其他功能
# 换供应商零代码改动（客户端就是标准 OpenAI 兼容的 POST {base_url}/chat/completions）。
# 已知接法：DeepSeek 官方 https://api.deepseek.com/v1（deepseek-chat）；
#           硅基流动 https://api.siliconflow.cn/v1（如 deepseek-ai/DeepSeek-V3，
#           key 在 https://cloud.siliconflow.cn 申请，只进环境变量不入本文件）。
#
# ---- 单供应商（旧写法，继续有效）：扁平三行 + key 只进环境变量 ----
# base_url    = "https://api.deepseek.com/v1"
# api_key_env = "KNOWATLAS_LLM_API_KEY"
# model       = "deepseek-chat"
#
# ---- 多供应商按序 failover（0.2.0 第二十一批）：[[llm.backends]] 数组表 ----
# 书写顺序即优先级：前面的 base_url 整体不可用（key 失效/限流/余额不足/5xx/连不上）
# 才切下一个；每个后端内部还支持多个 key（逗号分隔变量名/值，先换 key 再换 base_url）。
# 不写 backends 时由上面的扁平三行合成单后端——两种写法二选一，别混用。
#   [[llm.backends]]
#   base_url    = "https://api.deepseek.com/v1"      # 第一优先：DeepSeek 官方
#   api_key_env = "KNOWATLAS_LLM_API_KEY"            # 该后端的 key 环境变量名（可多个，逗号分隔）
#   model       = "deepseek-chat"
#
#   [[llm.backends]]
#   base_url    = "https://api.siliconflow.cn/v1"    # 兜底：硅基流动
#   api_key_env = "KNOWATLAS_LLM_API_KEY_SF1,KNOWATLAS_LLM_API_KEY_SF2"   # 两个 key 都塞给它
#   model       = "deepseek-ai/DeepSeek-V3"
#   # temperature = 0.1                              # 可选：覆盖下面的全局值
#
# 注意：serve 启动时读一次 key——新增/更换 key 后要重开终端并重启 serve 才生效
# （ksync 每次是新进程，重开终端重跑即可）。
enabled        = true
base_url       = "https://api.deepseek.com/v1"
api_key_env    = "KNOWATLAS_LLM_API_KEY"   # 环境变量名；本机已设 DeepSeek key
model          = "deepseek-chat"
temperature    = 0.2
max_batch      = 20                    # 每次批量送给 LLM 的条目数（控成本）。
                                       # 只认 [llm] 扁平键——写进 [[llm.backends]] 块里
                                       # 会被静默忽略；与用哪家供应商无关，放全局即可

[embedding]                             # 可选级；依赖缺失 / key 未设自动降级（检索退 FTS）
enabled  = false
provider = "local"                      # local（sentence-transformers，需 optional 依赖）
                                        # | openai（OpenAI 兼容 /embeddings，按量计费）
# ---- provider = "local" ----
model_path = ""                         # 留空 = BAAI/bge-m3；首次 encode 才加载
# ---- provider = "openai"（例：硅基流动 bge-m3 / Qwen3-Embedding）----
# base_url        = "https://api.siliconflow.cn/v1"
# model           = "BAAI/bge-m3"       # 1024 维；Qwen/Qwen3-Embedding-8B 为 4096 维
# api_key_env     = "KNOWATLAS_LLM_API_KEY_SF1"   # 只写变量名，密钥本体不入配置
# dim             = 1024                # 可留空：首批发回后自动填；换模型须 --embed-force 重建
# batch_size      = 32
# timeout_seconds = 30

[fetch]                                 # 正文抓取
default_backend   = "simple"            # simple | deepseek
fallback_backend  = "deepseek"          # simple 失败时的升级目标；置空则关闭升级
timeout_seconds   = 20
min_content_chars = 200
rate_limit_qps    = 4
max_retries       = 3
on_sync           = false               # K1：同步默认不抓正文；抓取只发生在 kadd / --fetch-limit
max_fetch_per_run = 50
# PDF 解析通道（0.2.0 批 97b）。实测：Hello-Agents（97.9 MB / 720 页）
#   markitdown(pdfplumber) 25 分钟 vs PDFium 2.2 秒；厦大讲义（51 MB / 882 页）8 分钟未完 vs 1.2 秒。
#   auto：页数 ≤300 且 ≤10 MB 走 markitdown（保表格的 markdown 结构），更大的走 PDFium
#         （快、且带页边界，清洗层能据此删页眉页脚与页码；代价是表格竖线退化）
#   pdfium：一律快速通道；markitdown：一律老通道（逐字节等同 97b 之前）
pdf_backend       = "auto"              # auto | pdfium | markitdown

# DeepSeek Fetch 升级后端（0.2.0 第二十四批接入；2026-10-17 官方上线）：
# simple 失败（HTTP≥400 / 正文过短 / 提取失败）的 URL 自动升级到这里，
# 返回 Markdown 正文。5 元/千次成功请求（失败/空结果不计费）；账号级 5 QPS + 域级限速，
# 429 按上面的 max_retries 指数退避。key 只进环境变量（默认复用 LLM 的 DeepSeek key）。
deepseek_base_url      = "https://api.deepseek.com"
deepseek_api_key_env   = "KNOWATLAS_LLM_API_KEY"

[clean]                                  # 通用清洗段（0.2.0 批 97a）：只让知识进库
# 每条规则都是为了真实噪音写的：页码/罗马数字行、目录点线行、重复页眉页脚、
# 末尾推广（公众号/知识星球/B站）、导航文件（navbar/sidebar）。
# 阈值为什么不放出来：页码占比 2%、目录点线 3 条、重复行 3 次、推广窗口 25 行、
# 推广上限 5% —— 这些是从真实语料（5.9 M 字符）量出来的，写死在 CleanThresholds
# 并由单测钉住；放成配置键只会让人误调成"洗不干净"或"洗掉正文"。
enabled        = true                    # false = 完全不动正文（回到 97a 之前的行为）
redact_enabled = true                    # 手机号/证件/邮箱/sk-* 密钥 → 掩码（隐私优先，即使放弃清洗也执行）
min_keep_ratio = 0.80                    # 删除行数超过 20% 时整篇放弃清洗、保留原文（防误杀闸门；
                                         # 页码重的书正常会删 10–15%，所以不能设到 0.9）

# ---- 知识源 ----
# 分源原则：按"数据形态"分，不按"目录"分。同一个目录（如 D:/Data/百卓）既有普通文档
# 又有 .emmx 脑图时，folders 和 emmx 两个源都把该目录填进各自的 roots 即可，互不冲突。
# 目前已实现：manual / bookmarks / folders / emmx / mail；其余源为后续版本占位。
#
# 入库前置审（批次 68 机制，用户 2026-10-24 采纳）：任一源加一行
#   new_entries = "pending"
# 后，该源新条目只进管理页「🆕 待审」队列——不抓正文、不分类、不抽点，等你
# 批量转正/舍弃后才进消费面。适合书签、邮件、AI 会话、聊天记录这类体量大或
# 噪音多的源（省抓取与 LLM 费用）；本地文件目录一般不用（抓取几乎零成本）。
# 缺省 "active"（零行为变化）。大体量源请同时做适配器层范围筛选（联系人/时间窗/
# 关键词），不要指望在待审列表里翻几万条。
#
# 第三取值 "auto"（工单 2026-10-27 入库即抽点）：新条目先过 L0 守门（资源直链/站点首页/
# 列表页/乱码 → 直接 rejected），其余**自动转正**并进入「抓正文 → 抽点」链路——仍然
# 不抓不抽等你点，但过滤掉明显垃圾。误杀可在管理页一键转正。

# ---- 入库即抽点（工单 2026-10-27-入库即抽点与自动老化）----
[ingest]                                 # 入库即处理：serve 内置巡检 + kauto 命令共用
enabled          = false                 # serve 起来就自动巡检；本机真库建议 true，示例文件缺省 false 防误烧
interval_seconds = 600                   # 巡检周期（秒）
max_entries_per_run = 10                 # 每轮总条数上限（费用护栏；0=不限）
max_retries      = 2                     # 单条目失败重试上限，超限进 meta.ingest.dead 不再烧钱
allow_kpe        = true                  # 允许自动走 KPE（PDF 书/超长文档）
kpe_max_chars    = 600000                # 单本进 KPE 的正文字数上限（防 250 万字级误入）

[points]                                 # 抽点阈值（KPE 与管道同源，改一处两边生效）
max_per_chunk    = 6                     # 单块/单条最多几个点（KPE --max-points；管道 split 上限）
chunk_chars      = 6000                  # 管道分块目标字数
chunk_total_max  = 60000                 # 管道内分块上限；超过改走 KPE（书/超长报告）

[aging]                                  # 老化（只标 stale 不删；物理删除仍走 30 天冷却的人裁出口）
auto             = true                  # 巡检到点自动跑老化（版本型零 LLM 先行）
interval_hours   = 24
limit_per_run    = 200
# 域闸门（用户 2026-10-27 裁决）：这些一级分类（含子树）下的点不自动老化——
# 「技术过时」对文学/历史/哲学没有意义；无分类的点也不判（宁漏勿误）。
exclude_categories = ["文学创作", "哲学", "历史", "文学", "艺术", "社会学",
                      "心理学", "经济学", "政治学", "法律", "教育", "宗教",
                      "人类学", "语言学", "传播学"]

[sources.bookmarks]
# 浏览器书签。browsers 里列了哪个浏览器，paths 里就要给哪个浏览器的 Bookmarks 文件路径
enabled = false
browsers = ["edge", "chrome"]
paths = { edge = "", chrome = "" }      # 本机 Bookmarks 文件路径，填好后改 enabled = true

[sources.folders]
# 本地文件夹中的普通文档（PDF/Office/txt/md 等），每个文件 = 一个条目
# roots 可填多个文件夹，逗号分开：roots = ["D:/Data/百卓", "E:/笔记"]
# 路径要求是本机可见的目录——各网盘的"本地同步盘"（OneDrive/坚果云等的同步文件夹）直接填其路径即可；
# 纯云端网盘（只有网页/API，本地没有同步目录）当前不支持，等后续云端适配器
# 全局目录级排除（所有文件系统型源共用：folder 及将来的邮件附件目录、会话记录产物、
# 聊天记录导出目录）。命中的目录整棵不采集，统计进 skipped_dir。
#   exclude_dirs = ["Fiction", ".git", "node_modules", "项目/*_备份"]
#     无 "/" 的写法 = 按目录名匹配（任意层级同名都排除）
#     带 "/" 的写法 = 按相对路径逐段匹配，段内可用通配
#   注意：匹配是自己实现的逐段比较（不依赖 fnmatch 跨分隔符通配），Windows/Linux 行为一致。
# 可选过滤（用户已在本机 config 启用）：
# include_exts = [".pdf", ".docx", ".md", ".txt", ".xlsx", ".pptx"]   # 白名单，白名单外直接排除
# exclude_globs = ["cj_session*", "~$*", "发票*"]                       # 文件名/路径黑名单（fnmatch 通配）
# max_entries = 5000        # 单次采集条目上限（缺省 2000；<=0 表示不限）
#   注意：撞上限会被静默截断，且未采集到的旧条目可能被误判为"源已删除"——
#   收录大目录（如整块数据盘）时务必调大或置 0，并在同步报告里看 truncated 数
enabled = false
roots = []                              # file:// 相对这些根

[sources.emmx]
# 万兴脑图 .emmx 文件：每个脑图节点 = 一个条目（不是每个文件一条）
# roots 同样可多个、逗号分开；可与 folders 填同一个目录（见上方"分源原则"）
# 只吃本地 .emmx 文件：MindMaster 云端脑图需先在软件里"另存为 .emmx"导出到 roots 目录
enabled = false
roots = []

[sources.mail]
# 邮件源（0.2.0 第三十九批已实现）：本项目不做 IMAP 直连、不碰邮箱凭证——
# 先用外部同步工具（如 offlineimap）把邮箱落成本地 maildir，再指向该目录。
# accounts.<账号名>.path = 该账号的 maildir 根目录；支持标准 maildir（cur/new/tmp）
# 与一层子文件夹（文件夹名入 meta.mailbox），也兼容目录直落 .eml 的导出形态。
# 会自动还原会话线程（In-Reply-To/Subject 归一）落线索库 thread_type='source'。
enabled = false
# new_entries = "pending"                # 体量大/引用链多：建议启用（见上方说明）
accounts = { work = { path = "" } }      # 示例：accounts = { work = { path = "D:/Mail/work" } }

[sources.db]
enabled = false
sqlite_paths = []
postgres_dsn = ""                       # 凭证走环境变量 KNOWATLAS_PG_DSN

[sources.ima]
enabled = false
client_id_env = "KNOWATLAS_IMA_CLIENT_ID"
api_key_env   = "KNOWATLAS_IMA_API_KEY"

[sources.opml]
# OPML 导入源（0.2.0 第五十批已实现）：外部工具导出的 OPML 大纲文件
# （书签/订阅列表迁移），或本工具 kexport --format opml 的产物回吃。
# files = 文件路径数组；outline 嵌套 → native_path 分类信号；只收 htmlUrl
# 的 http(s) 条目（type="rss" 订阅源跳过）。文件改名=换源（旧条目归档），
# 尽量用稳定路径。同步后照常走分类链路（先验映射/暂存区）。
enabled = false
files = []

[sources.txdoc]
enabled = false
app_id_env = "KNOWATLAS_TXDOC_APP_ID"

[sources.session]
enabled = false
# new_entries = "pending"                # 会话体量大：建议启用（见上方说明）
harvester_dirs = []                     # session-harvester 产物目录

[sources.bilibili]
enabled = false
sessdata_env = "KNOWATLAS_BILI_SESSDATA"  # 获取：浏览器 F12 → 应用 → Cookies → SESSDATA
up_mid = ""
fav_folder_ids = []                     # 空 = 自动拉全部收藏夹
qps = 2

[sources.manual]
enabled = true                          # kadd 常开

[sources.wx]
enabled = false
# new_entries = "pending"                # 聊天记录必须先范围筛（联系人/时间窗）再进待审
fav_export_dir = ""
chat_export_dir = ""
article_export_dir = ""
