<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="/manifest.webmanifest">

<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0;
         display: flex; height: 100vh;
         background: var(--bg-0); color: var(--text-1); }
  aside { width: 300px; overflow: auto; border-inline-end: 1px solid var(--border-1);
          padding: 12px; background: var(--bg-1); }
  main { flex: 1; overflow: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 500; }
  small { color: var(--text-3); }
  .btn { cursor: pointer; border: 1px solid var(--border-2);
         border-radius: var(--radius-ctrl);
         background: transparent; color: var(--text-2); font-size: var(--fs-12);
         padding: 2px 8px; }
  .btn:hover { background: var(--accent-soft); color: var(--text-1); }
  .btn.primary { border-color: var(--accent); color: var(--accent-text); }
  .btn.danger:hover { background: rgba(224, 92, 92, 0.15); color: var(--danger); }
  #new-thread { width: 100%; box-sizing: border-box; padding: 6px; margin: 8px 0; }
  .thread-row { display: flex; align-items: center; gap: 6px; margin: 2px 0;
                padding: 4px 6px; border-radius: var(--radius-ctrl); cursor: pointer; }
  .thread-row:hover { background: var(--accent-soft); }
  .thread-row.active { background: rgba(91, 141, 239, 0.24); font-weight: 500; }
  .thread-row .cnt { margin-left: auto; font-size: var(--fs-11); color: var(--text-3); }
  .thread-row .ops { display: none; gap: 2px; }
  .thread-row:hover .ops { display: inline-flex; }
  #recall-box { display: flex; gap: 8px; margin-bottom: 12px; }
  #recall-input { flex: 1; padding: 6px; box-sizing: border-box;
                  background: var(--bg-2); color: var(--text-1);
                  border: 1px solid var(--border-2);
                  border-radius: var(--radius-ctrl); font-size: var(--fs-13); }
  #recall-input:focus { border-color: var(--accent); outline: none; }
  .crumb { margin-bottom: 10px; }
  .hit { margin: 6px 0; padding: 6px 8px; border: 1px solid var(--border-1);
         border-radius: var(--radius-ctrl); background: var(--bg-1); }
  .hit a { font-weight: 500; color: var(--text-1); }
  .badge { display: inline-block; font-size: var(--fs-11);
           border: 1px solid var(--border-2); border-radius: 4px;
           padding: 0 4px; margin-left: 6px; color: var(--text-3); }
  .reason { display: inline-block; font-size: var(--fs-11);
            border: 1px dashed var(--accent); border-radius: 4px;
            padding: 0 6px; margin-left: 6px; color: var(--accent-text); }
  .group-label { font-size: var(--fs-12); color: var(--text-3); margin: 12px 0 4px; }
  .item { display: flex; align-items: center; gap: 8px; margin: 6px 0;
          padding: 6px 8px; border: 1px solid var(--border-1);
          border-radius: var(--radius-ctrl); background: var(--bg-1); }
  .item .pos { font-size: var(--fs-11); color: var(--text-3); min-width: 18px;
               text-align: end; }
  .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .item .t a { color: var(--text-1); }
  .item select { font-size: var(--fs-11); background: var(--bg-2);
                 color: var(--text-1); border: 1px solid var(--border-2);
                 border-radius: 4px; }
  .empty { color: var(--text-3); }
  #thread-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #thread-note { color: var(--text-3); font-size: var(--fs-13); }
  #digest-box { border: 1px dashed var(--accent); border-radius: var(--radius-ctrl);
                padding: 8px 12px; margin: 10px 0; font-size: var(--fs-13);
                white-space: pre-wrap; background: var(--accent-soft);
                color: var(--text-2); }
  #digest-box .digest-head { color: var(--accent-text); font-size: var(--fs-12);
                             margin-bottom: 4px; }
  .delta-sum { color: var(--text-3); font-size: var(--fs-12); margin-top: 2px; }
  .toolbar { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  dialog { border: 1px solid var(--border-2); border-radius: var(--radius-card);
           padding: 16px; background: var(--bg-2); color: var(--text-1);
           min-width: 320px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6); }
  dialog::backdrop { background: rgba(8, 10, 14, 0.62); }
  dialog input { width: 100%; box-sizing: border-box; padding: 6px; margin: 8px 0;
                 background: var(--bg-3); color: var(--text-1);
                 border: 1px solid var(--border-2);
                 border-radius: var(--radius-ctrl); }
  dialog input:focus { border-color: var(--accent); outline: none; }
  dialog .btns { display: flex; gap: 8px; justify-content: flex-end; }
  dialog button { cursor: pointer; padding: 4px 12px; }
  /* 批 98：窄屏——左侧 300px 线索列表改上下堆叠，对话框不越界 */
  @media (max-width: 820px) {
    body { flex-direction: column; height: auto; min-height: 100dvh; }
    aside { width: auto; max-height: 42vh; border-inline-end: 0;
            border-bottom: 1px solid var(--border-1); }
    main { padding: 12px; }
    #recall-box { flex-wrap: wrap; }
    #recall-input { min-width: 0; }
    .item { flex-wrap: wrap; gap: 4px; }
    dialog { min-width: 0; width: calc(100vw - 32px); box-sizing: border-box; }
  }
</style>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<aside>
  <div style="margin-bottom:8px"><a href="/index.html" style="color:var(--accent-text);font-size:13px">← 返回工作台</a></div>
  <h1>🧵 线索库</h1>
  <small>主题聚合召回 + 线索串联（完整方案 §9.4）。跨源散落的知识，按主题串成可复用的阅读路径。</small>
  <button id="new-thread" class="btn primary">＋ 新建线索</button>
  <div id="thread-list"><small>加载中…</small></div>
</aside>
<main>
  <div id="recall-box">
    <input id="recall-input" placeholder="输入主题词召回相关条目（如：Python 异步）；也支持 c:分类id / e:条目id">
    <button id="recall-btn" class="btn primary">召回</button>
  </div>
  <div id="hits"><small>输入主题词，多路召回（全文命中 / 同分类 / 同站点 / 同线索）会带关联解释列出。</small></div>
  <div id="thread-panel" style="display:none">
    <div id="thread-head">
      <span id="thread-name" style="font-size:16px;font-weight:600"></span>
      <span id="thread-note"></span>
    </div>
    <div class="toolbar">
      <button id="rename-btn" class="btn">✎ 重命名</button>
      <button id="note-btn" class="btn">✎ 备注</button>
      <button id="suggest-btn" class="btn">✨ LLM 建议排序</button>
      <button id="digest-btn" class="btn">📝 LLM 摘要</button>
      <button id="delete-btn" class="btn danger">🗑 删除线索</button>
    </div>
    <div id="digest-box" style="display:none"></div>
    <div id="items"></div>
  </div>
</main>
<dialog id="name-dialog">
  <form method="dialog" id="name-form">
    <div id="name-title" style="font-weight:600"></div>
    <input id="name-input" autocomplete="off">
    <div class="btns">
      <button type="button" id="name-cancel">取消</button>
      <button type="submit" id="name-ok">确定</button>
    </div>
  </form>
</dialog>
<script src="/ui.js"></script>
<script>
const SRC_LABEL = { folder: "文件", bookmark: "书签", manual: "手动", emmx: "脑图", mail: "邮件", opml: "OPML" };
const REL_LABEL = { seq: "顺承", because: "因果", prereq: "前置", contrast: "对比" };
const REASON_LABEL = {
  fts: "全文命中", focus_category: "焦点分类", focus_entry: "焦点条目",
  cocategory: "同分类", same_host: "同站点", thread: "同线索",
};
let currentThread = null;   // 当前打开的 Thread（含 items）
let recallHits = [];        // 最近一次召回结果
let sessionInfo = {};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function token() { return localStorage.getItem("knowatlas_token") || ""; }
async function ensureSession() {
  try { sessionInfo = await (await fetch("/api/session")).json(); } catch { sessionInfo = {}; }
  return sessionInfo;
}
async function writeJSON(url, body) {
  if (sessionInfo && sessionInfo.configured === false) {
    const t = await ka.prompt("服务端未读到写令牌环境变量，无法写操作。\n请在启动 serve 的终端查看令牌提示。");
    if (t === null) return { __aborted: true };
    localStorage.setItem("knowatlas_token", t.trim());
  }
  const r = await fetch(url, { method: "POST",
    headers: { "Content-Type": "application/json", "X-KnowAtlas-Token": token() },
    body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 403 && data && data.error && data.error.code === "FORBIDDEN") {
    await ensureSession();
    const retry = await fetch(url, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (retry.ok) return retry.json();
  }
  return data;
}
function reasonChip(reason) {
  const i = reason.indexOf(":");
  const key = i === -1 ? reason : reason.slice(0, i);
  const label = (REASON_LABEL[key] || key) + (i === -1 ? "" : ":" + reason.slice(i + 1));
  return `<span class="reason" title="关联解释：${esc(reason)}">${esc(label)}</span>`;
}
function entryLine(e) {
  return `<a href="${esc(e.locator)}" target="_blank" rel="noopener">${esc(e.title)}</a>`
       + `<span class="badge">${esc(SRC_LABEL[e.source_type] || e.source_type)}</span>`;
}

// ---- 线索列表 ----
async function loadThreadList() {
  const box = document.getElementById("thread-list");
  let data;
  try {
    data = await (await fetch("/api/threads")).json();
  } catch {                       // 加载失败明示可重试，不停留在「加载中…」
    box.innerHTML = `<small>线索列表加载失败——确认 serve 在跑后<a href="javascript:location.reload()" style="color:var(--accent-text)">刷新重试</a>。</small>`;
    return;
  }
  if (!data.threads || !data.threads.length) {
    box.innerHTML = "<small>默认空。还没有线索——点「新建线索」，或先在右侧做一次主题召回再固化。</small>";
    return;
  }
  box.innerHTML = data.threads.map(t =>
    `<div class="thread-row${currentThread && currentThread.id === t.id ? " active" : ""}" data-id="${t.id}">`
    + `<span class="n">🧵 ${esc(t.name)}</span><span class="cnt">${t.item_count} 条</span>`
    + `<span class="ops"><button class="btn" data-act="del" data-id="${t.id}" title="删除">🗑</button></span>`
    + `</div>`).join("");
  box.querySelectorAll(".thread-row").forEach(row => {
    row.onclick = (ev) => {
      if (ev.target.closest(".ops")) return;
      openThread(row.dataset.id);
    };
  });
  box.querySelectorAll("button[data-act=del]").forEach(b => b.onclick = async (ev) => {
    ev.stopPropagation();
    const t = data.threads.find(x => x.id === b.dataset.id);
    if (!(await ka.confirm(`删除线索「${t.name}」？（条目本身不受影响）`))) return;
    const res = await writeJSON(`/api/threads/${b.dataset.id}/delete`, {});
    if (res.error) { ka.toast("失败：" + res.error.message, "error"); return; }
    if (currentThread && currentThread.id === b.dataset.id) closeThread();
    loadThreadList();
  });
}

// ---- 线索编辑 ----
async function openThread(tid) {
  const data = await (await fetch(`/api/threads/${tid}`)).json();
  if (data.error) { ka.toast(data.error.message, "error"); return; }
  currentThread = data;
  renderThread();
  loadThreadList();
}
function closeThread() {
  currentThread = null;
  document.getElementById("thread-panel").style.display = "none";
  loadThreadList();
}
function renderThread() {
  if (!currentThread) return;
  const p = document.getElementById("thread-panel");
  p.style.display = "block";
  document.getElementById("thread-name").textContent = "🧵 " + currentThread.name;
  document.getElementById("thread-note").textContent = currentThread.note || "";
  const dbox = document.getElementById("digest-box");
  if (currentThread.digest) {
    dbox.style.display = "block";
    dbox.innerHTML = `<div class="digest-head">📝 线程摘要（LLM 生成，可重新生成覆盖）</div>`
      + esc(currentThread.digest);
  } else {
    dbox.style.display = "none";
    dbox.innerHTML = "";
  }
  const box = document.getElementById("items");
  if (!currentThread.items.length) {
    box.innerHTML = `<small class="empty">线索为空——在下方召回结果里点「＋加入」，或在任何条目视图「固化为线索」。</small>`;
    return;
  }
  box.innerHTML = currentThread.items.map((it, idx) =>
    `<div class="item" data-item="${it.item_id}">`
    + `<span class="pos">${idx + 1}</span>`
    + `<span class="t">${entryLine(it)}`
    + (it.delta_summary ? `<div class="delta-sum">💬 ${esc(it.delta_summary)}</div>` : "")
    + `</span>`
    + `<select data-rel="${it.item_id}" title="与上一条的关系">`
    + Object.keys(REL_LABEL).map(k =>
        `<option value="${k}"${it.relation_type === k ? " selected" : ""}>${REL_LABEL[k]}</option>`).join("")
    + `</select>`
    + `<button class="btn" data-act="note" data-item="${it.item_id}" title="编辑本条备注">✎</button>`
    + `<button class="btn" data-act="up" data-item="${it.item_id}" title="上移">↑</button>`
    + `<button class="btn" data-act="down" data-item="${it.item_id}" title="下移">↓</button>`
    + `<button class="btn danger" data-act="rm" data-item="${it.item_id}" title="移出线索">✕</button>`
    + `</div>`).join("");
  box.querySelectorAll("button[data-act]").forEach(b => b.onclick = async () => {
    const act = b.dataset.act, iid = b.dataset.item;
    const idx = currentThread.items.findIndex(x => x.item_id === iid);
    if (act === "up" && idx > 0) {
      const r = await writeJSON(`/api/threads/${currentThread.id}/items/${iid}/move`, { position: idx - 1 });
      if (r.error) ka.toast("失败：" + r.error.message, "error"); else openThread(currentThread.id);
    } else if (act === "down" && idx < currentThread.items.length - 1) {
      const r = await writeJSON(`/api/threads/${currentThread.id}/items/${iid}/move`, { position: idx + 1 });
      if (r.error) ka.toast("失败：" + r.error.message, "error"); else openThread(currentThread.id);
    } else if (act === "rm") {
      const r = await writeJSON(`/api/threads/${currentThread.id}/items/${iid}/remove`, {});
      if (r.error) ka.toast("失败：" + r.error.message, "error"); else openThread(currentThread.id);
    } else if (act === "note") {
      const it = currentThread.items[idx];
      const note = await ka.prompt(`条目「${it.title.slice(0, 40)}」的线索备注：`, it.note || "");
      if (note === null) return;
      await updateItem(iid, { note });
    }
  });
  // 关系类型变更（与上一条的关系：顺承/因果/前置/对比）
  box.querySelectorAll("select[data-rel]").forEach(sel => {
    sel.onchange = async () => {
      const r = await writeJSON(
        `/api/threads/${currentThread.id}/items/${sel.dataset.rel}/update`,
        { relation_type: sel.value });
      if (r.error) { ka.toast("失败：" + r.error.message, "error"); openThread(currentThread.id); }
    };
  });
}
async function updateItem(itemId, patch) {
  const r = await writeJSON(`/api/threads/${currentThread.id}/items/${itemId}/update`, patch);
  if (r.error) { ka.toast("失败：" + r.error.message, "error"); return; }
  openThread(currentThread.id);
}

// ---- 召回 ----
async function doRecall() {
  const q = document.getElementById("recall-input").value.trim();
  if (!q) return;
  const data = await (await fetch("/api/recall", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ topic: q }) })).json();
  recallHits = data.hits || [];
  const box = document.getElementById("hits");
  if (!recallHits.length) {
    box.innerHTML = `<small class="empty">无命中（resolved_as=${esc(data.resolved_as || "?")}）。换个主题词，或先收录更多条目。</small>`;
    return;
  }
  const groups = data.groups || {};
  const groupLabel = Object.entries(groups).map(([k, v]) =>
    `${SRC_LABEL[k] || k} ${v}`).join(" · ");
  box.innerHTML = `<div class="crumb"><small>命中 ${recallHits.length} 条（${esc(groupLabel)}）`
    + `· 种子 ${data.seeds} 条 · 解析方式 ${esc(data.resolved_as)}</small></div>`
    + recallHits.map(h =>
        `<div class="hit" data-eid="${h.entry_id}">`
        + entryLine(h)
        + (h.is_seed ? `<span class="badge">种子</span>` : "")
        + h.channels.map(reasonChip).join("")
        + ` <button class="btn" data-act="add" data-eid="${h.entry_id}">＋加入线索</button>`
        + `</div>`).join("");
  box.querySelectorAll("button[data-act=add]").forEach(b => b.onclick = () => addToCurrent(b.dataset.eid));
}
async function addToCurrent(entryId) {
  if (!currentThread) {
    ka.toast("先新建或选择一条线索（左侧列表）。", "warn");
    return;
  }
  const r = await writeJSON(`/api/threads/${currentThread.id}/items`, { entry_id: entryId });
  if (r.error) { ka.toast("失败：" + r.error.message, "error"); return; }
  openThread(currentThread.id);
  loadThreadList();
}

// ---- 新建 / 重命名 / 备注 / 删除 / 建议排序 ----
let nameDialogMode = null;  // new | rename | note
function openNameDialog(title, value, mode) {
  nameDialogMode = mode;
  document.getElementById("name-title").textContent = title;
  document.getElementById("name-input").value = value || "";
  document.getElementById("name-dialog").showModal();
}
document.getElementById("name-cancel").onclick = () => document.getElementById("name-dialog").close();
document.getElementById("name-form").onsubmit = async (e) => {
  e.preventDefault();
  const v = document.getElementById("name-input").value;
  document.getElementById("name-dialog").close();
  if (nameDialogMode === "new") {
    const res = await writeJSON("/api/threads", { name: v.trim() });
    if (res.error) { ka.toast("失败：" + res.error.message, "error"); return; }
    await loadThreadList();
    openThread(res.id);
  } else if (nameDialogMode === "rename") {
    const res = await writeJSON(`/api/threads/${currentThread.id}/update`, { name: v.trim() });
    if (res.error) { ka.toast("失败：" + res.error.message, "error"); return; }
    openThread(currentThread.id);
  } else if (nameDialogMode === "note") {
    const res = await writeJSON(`/api/threads/${currentThread.id}/update`, { note: v });
    if (res.error) { ka.toast("失败：" + res.error.message, "error"); return; }
    openThread(currentThread.id);
  }
};
document.getElementById("new-thread").onclick = () => openNameDialog("新线索名称：", "", "new");
document.getElementById("rename-btn").onclick = () =>
  openNameDialog("重命名线索：", currentThread.name, "rename");
document.getElementById("note-btn").onclick = () =>
  openNameDialog("线索备注：", currentThread.note || "", "note");
document.getElementById("delete-btn").onclick = async () => {
  if (!(await ka.confirm(`删除线索「${currentThread.name}」？（条目本身不受影响）`))) return;
  const res = await writeJSON(`/api/threads/${currentThread.id}/delete`, {});
  if (res.error) { ka.toast("失败：" + res.error.message, "error"); return; }
  closeThread();
};
document.getElementById("suggest-btn").onclick = async () => {
  if (!currentThread) return;
  const res = await writeJSON(`/api/threads/${currentThread.id}/suggest`, {});
  if (res.error) { ka.toast("失败：" + res.error.message, "error"); return; }
  if (!res.llm_used) {
    ka.toast("LLM 不可用或未配置（[llm] enabled + key）——已按当前顺序返回，未做改动。", "warn");
    return;
  }
  const why = res.rationale ? "\n\n建议理由：\n" + res.rationale : "";
  await ka.alert(`已应用 LLM 建议排序${res.applied ? "" : "（未能写入，请刷新后重试）"}。${why}`, "建议排序完成");
  openThread(currentThread.id);
};
document.getElementById("digest-btn").onclick = async () => {
  if (!currentThread) return;
  const btn = document.getElementById("digest-btn");
  btn.disabled = true;
  btn.textContent = "⏳ 生成中…";
  try {
    const res = await writeJSON(`/api/threads/${currentThread.id}/digest`, {});
    if (res.error) { ka.toast("失败：" + res.error.message, "error"); return; }
    if (!res.llm_used) {
      ka.toast("LLM 不可用或未配置（[llm] enabled + key）——摘要未生成，线程视图不受影响。", "warn");
      openThread(currentThread.id);
      return;
    }
    ka.toast(`摘要完成：${res.summarized} 条「本轮新增」已落条目，线程级摘要${res.applied ? "已写入" : "未能写入（请重试）"}。`, "success");
    openThread(currentThread.id);
  } finally {
    btn.disabled = false;
    btn.textContent = "📝 LLM 摘要";
  }
};
document.getElementById("recall-btn").onclick = doRecall;
document.getElementById("recall-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doRecall();
});

// ---- 启动：?id= 直接打开指定线索 ----
(async () => {
  await ensureSession();
  await loadThreadList();
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if (id) openThread(id);
})();
</script>
<script>
// PWA 壳（批 98）：SW 仅在安全上下文（localhost / https）注册；内网 http 静默跳过
if ("serviceWorker" in navigator && window.isSecureContext) {
  addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
}
</script>
