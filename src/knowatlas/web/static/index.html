<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>知道 KnowAtlas</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0;
         display: flex; height: 100vh; }
  aside { width: 340px; overflow: auto; border-inline-end: 1px solid #8884;
          padding: 12px; }
  main { flex: 1; overflow: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  small { color: #888; }
  #search { width: 100%; box-sizing: border-box; padding: 6px; margin: 8px 0; }
  .wb-tab { cursor: pointer; border: 1px solid #8886; border-radius: 4px 4px 0 0;
            background: transparent; color: inherit; font-size: 13px; padding: 4px 12px; }
  .wb-tab.on { border-bottom-color: transparent; font-weight: 600; color: #4a9eff; }
  #wb-tabs { display: flex; gap: 4px; align-items: center; margin: 10px 0 0;
             border-bottom: 1px solid #8884; padding-bottom: 0; }
  #wb-tabs button { cursor: pointer; }
  #wb-solidify { border: 1px solid #4a9eff55; border-radius: 4px; background: none;
                 color: #4a9eff; font-size: 12px; padding: 3px 10px; margin-bottom: 4px; }
  #wb-body { padding-top: 10px; }
  .wb-radiate-focus { font-weight: 700; margin-bottom: 6px; }
  .wb-channel { margin: 10px 0 4px; font-size: 12px; color: #888;
                border-bottom: 1px dashed #8884; padding-bottom: 2px; }
  .wb-focus-btn { cursor: pointer; border: 1px solid #8886; border-radius: 4px;
                  background: transparent; color: inherit; font-size: 11px;
                  padding: 0 6px; margin-left: 6px; }
  #staged-btn { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 8px;
                cursor: pointer; }
  .tree-node { margin: 2px 0 2px 12px; }
  .tree-node > .row { display: flex; align-items: center; gap: 6px; }
  .tree-node > .row > .name { cursor: pointer; }
  .tree-node > .row > .name:hover { text-decoration: underline; }
  .tree-node > .row > .name.active { font-weight: 700; }
  .tree-node > .row > .name.empty { opacity: .5; font-style: italic; }
  .tree-node > .row > .ops { display: none; gap: 2px; }
  .tree-node > .row:hover > .ops { display: inline-flex; }
  .ops button { cursor: pointer; border: 1px solid #8886; border-radius: 4px;
                background: transparent; color: inherit; font-size: 11px;
                padding: 0 4px; }
  .crumb { margin-bottom: 10px; }
  .crumb span { cursor: pointer; color: #4a9eff; }
  .entry { margin: 8px 0; padding: 6px 8px; border: 1px solid #8884; border-radius: 6px; }
  .entry a { font-weight: 600; }
  .badge { display: inline-block; font-size: 11px; border: 1px solid #8886;
           border-radius: 4px; padding: 0 4px; margin-left: 6px; color: #888; }
  .cat-chip { display: inline-block; font-size: 11px; color: #4a9eff;
              border: 1px dashed #4a9eff66; border-radius: 4px; padding: 0 6px;
              margin-left: 6px; cursor: pointer; }
  .cat-chip:hover { background: #4a9eff22; }
  .tree-node > .row > .name.flash { animation: catflash 1.1s ease 2; }
  @keyframes catflash { 0%, 100% { background: transparent; }
                        45% { background: #4a9eff55; } }
  .move-btn, .reject-btn { cursor: pointer; border: 1px solid #8886; border-radius: 4px;
              background: transparent; color: inherit; font-size: 11px;
              padding: 0 6px; margin-left: 6px; display: none; }
  .entry:hover .move-btn, .entry:hover .reject-btn { display: inline-block; }
  #filter { margin: 8px 0; }
  dialog { border: 1px solid #8888; border-radius: 8px; padding: 16px;
           background: Canvas; color: CanvasText; min-width: 320px; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog input { width: 100%; box-sizing: border-box; padding: 6px; margin: 8px 0; }
  dialog .btns { display: flex; gap: 8px; justify-content: flex-end; }
  dialog button { cursor: pointer; padding: 4px 12px; }
</style>
</head>
<body>
<aside>
  <h1>知道 KnowAtlas</h1>
  <small>个人知识统一索引 · 分类树（点击下钻；悬停节点出现管理按钮）</small>
  <input id="search" placeholder="工作台：输入主题词 → 聚合结果 / 线索 / 放射 三视图">
  <a href="/graph.html" style="display:block;margin-bottom:8px;font-size:13px">🕸️ 知识关系图（下钻 / 放射探索 / 反查 / 路径固化）</a>
  <a href="/thread.html" style="display:block;margin-bottom:8px;font-size:13px">🧵 串联工作区（主题聚合 + 线索）</a>
  <!-- 数据管理入口默认折叠（第三十七批用户定调：日常是消费数据，采集/清理只在新数据时用） -->
  <details id="mgmt" style="margin:4px 0 8px">
  <summary style="cursor:pointer;font-size:13px;color:#888">🛠 数据管理（采集 / 清理）</summary>
  <div style="display:flex;gap:6px;margin:8px 0">
    <input id="add-url" placeholder="粘贴 http(s) 网址，手动收录（同 kadd：抓正文→归类→入树）"
           style="flex:1;box-sizing:border-box;padding:6px">
    <button id="add-url-btn">🔗收录</button>
  </div>
  <div id="add-url-out" style="font-size:12px;color:#888;margin-bottom:8px;word-break:break-all"></div>
  <button id="staged-btn" style="width:100%;box-sizing:border-box;padding:6px;margin:8px 0">📥 暂存区（未分类条目）</button>
    <a href="#" id="rejected-link" style="display:block;margin-bottom:8px;font-size:13px">🗑️ 已舍弃条目</a>
    <a href="#" id="dead-link" style="display:block;margin-bottom:8px;font-size:13px">☠️ 失效链接（体检 dead）</a>
    <a href="#" id="nonk-link" style="display:block;margin-bottom:8px;font-size:13px">🔬 待清理候选（规则/LLM 判非知识）</a>
    <a href="#" id="fresh-link" style="display:block;margin-bottom:8px;font-size:13px">⏳ 时效候选（过期/疑似过旧）</a>
  </details>
  <label style="display:block;margin:8px 0 0;font-size:12px;opacity:.7;user-select:none">
    <input type="checkbox" id="show-empty-cats"> 显示空分类（条目已清空的）
  </label>
  <div id="tree">加载中…</div>
</aside>
<dialog id="move-dialog">
  <form method="dialog" id="move-form">
    <div id="move-title" style="font-weight:600"></div>
    <input id="move-input" list="catlist" placeholder="输入或从列表选择分类路径" autocomplete="off">
    <datalist id="catlist"></datalist>
    <div class="btns">
      <button type="button" id="move-cancel">取消</button>
      <button type="submit" id="move-ok">确定</button>
    </div>
  </form>
</dialog>
<main>
  <div id="crumb"></div>
  <select id="filter" style="display:none">
    <option value="">全部来源</option>
    <option value="bookmark">书签</option>
    <option value="manual">手动</option>
  </select>
  <div id="hits"><small>点击左侧分类查看条目；或输入关键词全文检索。</small></div>
</main>
<script>
let pathToId = {};     // 派生路径 → 分类 id（供移动/合并输入目标）
let currentCat = null; // 当前选中分类 id
let refreshCurrent = null; // 当前视图刷新器——写操作成功后局部刷新，不跳转
let showEmptyCats = localStorage.getItem("knowatlas-show-empty") === "1"; // 空分类默认不占视线

function token() { return localStorage.getItem("knowatlas_token") || ""; }
// 页面打开时向服务端要一次同源写凭据（服务端种 HttpOnly Cookie，浏览器自动携带）。
// 令牌由服务端环境变量决定，用户**不需要手工填任何令牌**。
let sessionInfo = {};
async function ensureSession() {
  try { sessionInfo = await (await fetch("/api/session")).json(); } catch { sessionInfo = {}; }
  return sessionInfo;
}
async function writeJSON(url, body) {
  // 兜底：仅当服务端未配置令牌（理论上 serve 启动即自动生成，实践中不会发生）
  if (sessionInfo && sessionInfo.configured === false) {
    const t = prompt("服务端未读到写令牌环境变量，无法写操作。\n请在启动 serve 的终端查看令牌提示。");
    if (t === null) return { __aborted: true };
    localStorage.setItem("knowatlas_token", t.trim());
  }
  const r = await fetch(url, { method: "POST",
    headers: { "Content-Type": "application/json", "X-KnowAtlas-Token": token() },
    body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 403 && data && data.error && data.error.code === "FORBIDDEN") {
    // 凭据失效（例如 serve 重启后换了令牌）——重取一次会话再试，仍失败才提示
    await ensureSession();
    const retry = await fetch(url, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (retry.ok) return retry.json();
  }
  return data;
}

async function loadTree() {
  const data = await (await fetch("/api/tree")).json();
  pathToId = {};
  // 下拉（移动/合并目标）只收非空分类——把条目搬进/合进空分类没有意义；
  // count 缺失（旧后端进程）时放行，不误杀
  const collect = (nodes) => { for (const n of nodes) {
    if (n.count === undefined || n.count > 0) pathToId[n.path] = n.id;
    collect(n.children); } };
  collect(data.tree);
  document.getElementById("catlist").innerHTML =
    Object.keys(pathToId).map(p => `<option value="${p}">`).join("");
  const box = document.getElementById("tree");
  box.textContent = "";
  const render = (nodes, parent) => {
    for (const n of nodes) {
      if (n.count === 0 && !showEmptyCats) continue;  // 空枝默认隐藏（count 缺失≠空，防旧后端误杀）
      const div = document.createElement("div");
      div.className = "tree-node";
      const row = document.createElement("div"); row.className = "row";
      const name = document.createElement("span");
      name.className = "name" + (n.id === currentCat ? " active" : "")
                     + (n.count === 0 ? " empty" : "");
      if (n.count === 0) name.title = "该分类（含子分类）下暂无 active 条目";
      name.textContent = n.name;
      name.onclick = () => showCategory(n.id);
      nodeEls[n.id] = name;  // 双向联动②：供条目徽标点击时定位
      const ops = document.createElement("span"); ops.className = "ops";
      const mk = (label, title, fn) => {
        const b = document.createElement("button");
        b.textContent = label; b.title = title; b.onclick = (e) => { e.stopPropagation(); fn(n); };
        return b;
      };
      ops.appendChild(mk("＋", "新建子分类", opAddChild));
      ops.appendChild(mk("✎", "重命名", opRename));
      ops.appendChild(mk("⇄", "移动到另一分类（输入目标路径）", opMove));
      ops.appendChild(mk("⇒", "合并进另一分类（输入目标路径）", opMerge));
      row.appendChild(name); row.appendChild(ops);
      div.appendChild(row);
      parent.appendChild(div);
      render(n.children, div);
    }
  };
  render(data.tree, box);
  if (!data.tree.length) box.innerHTML = "<small>暂无分类；用 kadd / ksync 收录第一批条目。</small>";
}

async function opAddChild(n) {
  const name = prompt(`在「${n.name}」下新建子分类，名称：`);
  if (!name) return;
  const res = await writeJSON("/api/categories", { name, parent_ids: [n.id] });
  if (!res.__aborted && !res.error) loadTree();
  else if (res.error) alert("失败：" + res.error.message);
}
async function opRename(n) {
  const name = prompt(`重命名「${n.name}」为：`, n.name);
  if (!name || name === n.name) return;
  const res = await writeJSON(`/api/categories/${n.id}/rename`, { name });
  if (!res.__aborted && !res.error) loadTree();
  else if (res.error) alert("失败：" + res.error.message);
}
async function opMove(n) {
  const p = prompt(`移动「${n.name}」到目标分类（输入其完整路径如 技术开发/前端；留空 = 移到顶层）：`);
  if (p === null) return;
  const pid = pathToId[p.trim()];
  if (p.trim() && !pid) { alert("目标路径不存在：" + p); return; }
  const res = await writeJSON(`/api/categories/${n.id}/move`, { parent_ids: pid ? [pid] : [] });
  if (!res.__aborted && !res.error) loadTree();
  else if (res.error) alert("失败：" + res.error.message);
}
async function opMerge(n) {
  const p = prompt(`把「${n.name}」合并进目标分类（其条目与子树并入，本分类删除）。目标完整路径：`);
  if (!p) return;
  const tid = pathToId[p.trim()];
  if (!tid) { alert("目标路径不存在：" + p); return; }
  if (!confirm(`确认把「${n.name}」合并进「${p}」？该操作不可自动撤销。`)) return;
  const res = await writeJSON(`/api/categories/${n.id}/merge`, { target_id: tid });
  if (!res.__aborted && !res.error) { if (currentCat === n.id) currentCat = null; loadTree(); }
  else if (res.error) alert("失败：" + res.error.message);
}

const SRC_LABEL = { folder: "文件", bookmark: "书签", manual: "手动", emmx: "脑图", mail: "邮件", expand: "扩散" };
function srcLabel(t) { return SRC_LABEL[t] || t; }
function entryHTML(e) {
  return `<div class="entry" data-id="${e.id}"><a href="${e.locator}" target="_blank" rel="noopener">${e.title}</a>`
       + `<span class="badge">${srcLabel(e.source_type)}</span>`
       + `<button class="move-btn" data-id="${e.id}" data-title="${e.title.replace(/"/g, "&quot;")}">⇄改分类</button>`
       + `<button class="reject-btn" data-id="${e.id}" data-title="${e.title.replace(/"/g, "&quot;")}">🚫舍弃</button></div>`;
}
function bindEntryButtons() {
  document.querySelectorAll(".move-btn").forEach(b => b.onclick = () => opRecategorize(b.dataset.id, b.dataset.title));
  document.querySelectorAll(".reject-btn").forEach(b => b.onclick = () => opReject(b.dataset.id, b.dataset.title));
  // 复制条目 ID（第四十二批）：统一注入到所有带 data-id 的条目行——
  // 分类列表/检索/待清理/时效/聚合等全部视图自动获得，无需逐视图改模板。
  // 主要用途：拿 id 跑 ksync --expand <entry_id> 扩散抓取。
  document.querySelectorAll("#hits .entry[data-id]").forEach(d => {
    if (d.querySelector(".cid-btn")) return;
    d.insertAdjacentHTML("beforeend",
      `<button class="cid-btn" data-id="${d.dataset.id}" title="复制条目 ID（ksync --expand 等命令用）">🆔</button>`);
  });
  document.querySelectorAll(".cid-btn").forEach(b => b.onclick = () => {
    navigator.clipboard.writeText(b.dataset.id)
      .then(() => { b.textContent = "✓"; setTimeout(() => b.textContent = "🆔", 800); })
      .catch(() => { prompt("复制失败，请手动复制条目 ID：", b.dataset.id); });
  });
  attachCatChips();  // 双向联动②：条目 → 分类定位徽标（所有条目视图统一挂）
}
// 双向联动②：条目列表点「📁分类路径」徽标 → 左树滚动定位 + 闪烁高亮。
// （双向联动①：点树节点 → 右侧条目列表，showCategory 已有）
const nodeEls = {};  // 分类 id → 树节点元素（loadTree 渲染时登记）
function highlightInTree(catId) {
  const el = nodeEls[catId];
  if (!el) return;  // 未渲染（被空枝过滤等）→ 静默跳过
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("flash"); void el.offsetWidth;  // 强制重排以重启动画
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 2400);
}
async function attachCatChips() {
  const divs = [...document.querySelectorAll("#hits .entry[data-id]")];
  if (!divs.length) return;
  const ids = [...new Set(divs.map(d => d.dataset.id))].slice(0, 100);
  const data = await (await fetch("/api/entries/linkage?ids=" + ids.join(","))).json();
  if (!data.linkage) return;
  for (const div of divs) {
    const cats = data.linkage[div.dataset.id];
    if (!cats || !cats.length) continue;
    div.insertAdjacentHTML("beforeend", cats.map(c =>
      `<span class="cat-chip" data-cid="${c.category_id}" title="点击在左侧树中定位该分类">📁${c.path}</span>`).join(""));
  }
  document.querySelectorAll("#hits .cat-chip").forEach(ch =>
    ch.onclick = () => highlightInTree(ch.dataset.cid));
}
let moveTargetId = null;
function opRecategorize(entryId, title) {
  moveTargetId = entryId;
  document.getElementById("move-title").textContent = `把「${title.slice(0, 60)}」移到：`;
  document.getElementById("move-input").value = "";
  document.getElementById("move-dialog").showModal();
}
document.getElementById("move-cancel").onclick = () => document.getElementById("move-dialog").close();
document.getElementById("move-form").onsubmit = async (e) => {
  e.preventDefault();
  const p = document.getElementById("move-input").value.trim().replace(/^\/+|\/+$/g, "");
  if (!p || !moveTargetId) return;
  const res = await writeJSON(`/api/entries/${moveTargetId}/recategorize`, { target_path: p });
  document.getElementById("move-dialog").close();
  if (res.error) { alert("失败：" + res.error.message); return; }
  // 留在当前视图，只局部刷新（不跳转）
  refreshCurrent ? refreshCurrent() : loadTree();
}
async function opReject(entryId, title) {
  if (!confirm(`舍弃「${title.slice(0, 60)}」？\n\n将不再出现在树/检索/图中；重新同步也不会恢复。\n（可在「已舍弃条目」里找回）`)) return;
  const res = await writeJSON(`/api/entries/${entryId}/reject`, {});
  if (res.error) { alert("失败：" + res.error.message); return; }
  refreshCurrent ? refreshCurrent() : loadTree();
}
document.getElementById("dead-link").onclick = async (e) => {
  e.preventDefault();
  refreshCurrent = () => e.target.click();  // 写操作后留在本视图
  currentCat = null;
  document.getElementById("crumb").textContent =
    "☠️ 失效链接（404/410 = 永久消失；error = 疑似临时故障，可重测）";
  document.getElementById("filter").style.display = "none";
  const data = await (await fetch("/api/dead-links")).json();
  const row = (x, tag, code) =>
    `<div class="entry" data-id="${x.id}"><a href="${x.locator}" target="_blank" rel="noopener">${x.title}</a>`
    + `<span class="badge">${tag}${x.code ? " " + x.code : ""}</span>`
    + `<button class="reject-btn" data-id="${x.id}" data-title="${x.title.replace(/"/g, "&quot;")}">🚫舍弃</button></div>`;
  const box = document.getElementById("hits");
  const all = [...data.dead.map(x => row(x, "失效", x.code)),
               ...data.error.map(x => row(x, "疑似临时", x.code))];
  box.innerHTML = all.length ? all.join("")
    : "<small>没有失效链接。用 CLI 跑体检：uv run python -m knowatlas kcheck</small>";
  bindEntryButtons();
  const rejectMany = async (ids) => {
    for (const id of ids) await writeJSON(`/api/entries/${id}/reject`, {});
    e.target.click();
  };
  if (data.dead.length)
    box.insertAdjacentHTML("beforeend",
      `<button id="reject-all-dead" style="margin-top:12px;padding:6px 14px;cursor:pointer">🚫 一键舍弃全部 ${data.dead.length} 条失效链接</button>`);
  document.getElementById("reject-all-dead")?.addEventListener("click",
    () => { if (confirm(`确认舍弃全部 ${data.dead.length} 条失效链接？（可在已舍弃里找回）`))
      rejectMany(data.dead.map(x => x.id)); });
};

document.getElementById("nonk-link").onclick = async (e) => {
  e.preventDefault();
  refreshCurrent = () => e.target.click();  // 写操作后留在本视图
  currentCat = null;
  document.getElementById("crumb").textContent =
    "🔬 待清理候选——规则或 LLM 判为「非具体知识」（站点门户/资源列表/纯资源文件）。仅标记，由你决定。";
  document.getElementById("filter").style.display = "none";
  const data = await (await fetch("/api/not-knowledge")).json();
  const reasonLabel = { resource_file: "资源文件", portal_homepage: "站点首页", index_subdir: "列表子页",
                        unreachable: "无法访问", unparseable: "解析失败", garbled: "乱码" };
  const box = document.getElementById("hits");
  box.innerHTML = data.entries.length
    ? data.entries.map(x =>
        `<div class="entry" data-id="${x.id}"><a href="${x.locator}" target="_blank" rel="noopener">${x.title}</a>`
        + `<span class="badge">${srcLabel(x.source_type)}</span>`
        + (x.reason ? `<span class="badge" title="结构规则判定：${x.reason}">${reasonLabel[x.reason] || x.reason}</span>` : "")
        + `<button class="reject-btn" data-id="${x.id}" data-title="${x.title.replace(/"/g, "&quot;")}">🚫舍弃</button>`
        + `<button class="keep-btn" data-id="${x.id}">↩是知识，保留</button></div>`).join("")
    : "<small>没有待清理候选。跑一次 ksync --value-scan（纯规则、零费用）或 ksync --reclassify（LLM 全量评估）。</small>";
  bindEntryButtons();
  document.querySelectorAll(".keep-btn").forEach(b => b.onclick = async () => {
    // 保留：置 value_flag=ok（之后规则与 LLM 都不再标记它；保留动作记录在 task_log）
    await writeJSON(`/api/entries/${b.dataset.id}/unflag`, {});
    e.target.click();
  });
  const ids = data.entries.map(x => x.id);
  if (ids.length)
    box.insertAdjacentHTML("beforeend",
      `<button id="reject-all-nonk" style="margin-top:12px;padding:6px 14px;cursor:pointer">🚫 一键舍弃全部 ${ids.length} 条候选</button>`);
  document.getElementById("reject-all-nonk")?.addEventListener("click",
    () => { if (confirm(`确认舍弃全部 ${ids.length} 条候选？（可在已舍弃里找回）`)) {
      (async () => { for (const id of ids) await writeJSON(`/api/entries/${id}/reject`, {}); e.target.click(); })();
    } });
};

document.getElementById("fresh-link").onclick = async (e) => {
  e.preventDefault();
  refreshCurrent = () => e.target.click();  // 写操作后留在本视图
  currentCat = null;
  document.getElementById("crumb").textContent =
    "⏳ 时效候选——规则判为「过期或疑似过旧」（废弃关键词/正文日期过旧/同主题已有更新版本）。仅标记，由你决定。";
  document.getElementById("filter").style.display = "none";
  const data = await (await fetch("/api/freshness")).json();
  const reasonLabel = { keyword: "废弃关键词", date_old: "日期过旧", newer_version: "有更新版本" };
  const flagLabel = { stale: "明确过期", suspect: "疑似过旧" };
  const rows = [...data.stale.map(x => ({...x, flag: "stale"})),
                ...data.suspect.map(x => ({...x, flag: "suspect"}))];
  const box = document.getElementById("hits");
  box.innerHTML = rows.length
    ? rows.map(x =>
        `<div class="entry" data-id="${x.id}"><a href="${x.locator}" target="_blank" rel="noopener">${x.title}</a>`
        + `<span class="badge">${srcLabel(x.source_type)}</span>`
        + `<span class="badge">${flagLabel[x.flag] || x.flag}</span>`
        + (x.reason ? `<span class="badge" title="时效规则判定：${x.reason}">${reasonLabel[x.reason] || x.reason}</span>` : "")
        + `<button class="reject-btn" data-id="${x.id}" data-title="${x.title.replace(/"/g, "&quot;")}">🚫舍弃</button>`
        + `<button class="keep-btn" data-id="${x.id}">↩不过时，保留</button></div>`).join("")
    : "<small>没有时效候选。跑一次 ksync --freshness-scan（纯规则、零费用）。</small>";
  bindEntryButtons();
  document.querySelectorAll(".keep-btn").forEach(b => b.onclick = async () => {
    // 保留：置 freshness_flag=ok（之后规则不再标记它；保留动作记录在 task_log）
    await writeJSON(`/api/entries/${b.dataset.id}/unflag-freshness`, {});
    e.target.click();
  });
  const ids = rows.map(x => x.id);
  if (ids.length)
    box.insertAdjacentHTML("beforeend",
      `<button id="reject-all-fresh" style="margin-top:12px;padding:6px 14px;cursor:pointer">🚫 一键舍弃全部 ${ids.length} 条候选</button>`);
  document.getElementById("reject-all-fresh")?.addEventListener("click",
    () => { if (confirm(`确认舍弃全部 ${ids.length} 条候选？（可在已舍弃里找回）`)) {
      (async () => { for (const id of ids) await writeJSON(`/api/entries/${id}/reject`, {}); e.target.click(); })();
    } });
};

document.getElementById("rejected-link").onclick = async (e) => {
  e.preventDefault();
  refreshCurrent = () => e.target.click();  // 写操作后留在本视图
  currentCat = null;
  document.getElementById("crumb").textContent = "🗑️ 已舍弃条目（点击恢复后重新参与分类）";
  document.getElementById("filter").style.display = "none";

    ? data.entries.map(x =>

        + `<span class="badge">${srcLabel(x.source_type)}</span>`
        + `<button class="restore-btn" data-id="${x.id}">↩恢复</button></div>`).join("")

function renderEntries(list) {
  const box = document.getElementById("hits");
  box.innerHTML = list.length ? list.map(entryHTML).join("") : "<small>该分类下暂无条目。</small>";
  bindEntryButtons();
}

async function showCategory(catId) {
  currentCat = catId;
  refreshCurrent = () => showCategory(catId);
  document.getElementById("filter").style.display = "block";
  const data = await (await fetch(`/api/categories/${catId}/entries`)).json();
  if (data.error) { alert(data.error.message); return; }
  const crumb = document.getElementById("crumb");
  const parts = (data.paths[0] || "").split("/");
  crumb.innerHTML = parts.map((p, i) =>
    `<span data-p="${parts.slice(0, i + 1).join("/")}">${p}</span>`).join(" / ");
  crumb.querySelectorAll("span").forEach(s =>
    s.onclick = () => showCategory(pathToId[s.dataset.p]));
  renderEntries(data.entries);
  document.getElementById("filter").onchange = (e) => {
    const v = e.target.value;
    renderEntries(v ? data.entries.filter(x => x.source_type === v) : data.entries);
  };
  loadTree();  // 刷新选中态
}

// 手动收录网页（第四十二批）：同 kadd 链路（POST /api/entries → ingest_url：
// 抓正文 → 归类 → 入树）；结果显示 entry_id（可复制，直接接 ksync --expand）
document.getElementById("add-url-btn").onclick = async () => {
  const url = document.getElementById("add-url").value.trim();
  const out = document.getElementById("add-url-out");
  if (!url) { out.textContent = "先粘贴网址。"; return; }
  out.textContent = "抓取并归类中…（页面大时需要几秒）";
  const res = await writeJSON("/api/entries", { url });
  if (res.__aborted) { out.textContent = ""; return; }
  if (res.error) { out.textContent = "失败：" + res.error.message; return; }
  const parts = [];
  if (res.status === "duplicate") parts.push("该网址已在库中（幂等，未重复建）");
  else parts.push(res.fetched ? "已抓取正文" : "未抓到正文（已入 URL，可用补抓通道补正文）");
  parts.push(res.categorized ? "已归类" : "待归类（暂存区）");
  if (res.fetch_error) parts.push("抓取提示：" + res.fetch_error);
  out.innerHTML = `✓ ID <code style="cursor:pointer;color:#4a9eff" class="add-id" data-id="${res.entry_id}"
    title="点击复制条目 ID（ksync --expand 用）">${res.entry_id}</code> —— ${parts.join("；")}`;
  document.querySelector(".add-id").onclick = ev =>
    navigator.clipboard.writeText(ev.target.dataset.id).then(() => { ev.target.textContent = "已复制 ✓"; });
  if (res.status !== "duplicate") loadTree();  // 新条目可能带来新分类
};
document.getElementById("add-url").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("add-url-btn").click();
});

document.getElementById("staged-btn").onclick = async (e) => {
  refreshCurrent = () => e.target.click();  // 写操作后留在本视图
  currentCat = null;
  document.getElementById("crumb").textContent = "📥 暂存区（未分类条目）";
  document.getElementById("filter").style.display = "none";
  const data = await (await fetch("/api/uncategorized?limit=500")).json();
  renderEntries(data.entries);
};

// ---- 统一入口工作台（第三十四批，契约 §9.4：模式是视图切换，不是启动分叉） ----
// 检索提交后同时拉 FTS 与 topic_recall，按条目去重合并，三视图共享同一份结果：
// 聚合结果（带关联解释） / 线索（命中条目所属线索聚合） / 放射（焦点邻域持续下钻）。
const wb = { q: "", merged: [], tab: "agg", focusId: null };

function chLabel(ch) {
  if (ch.startsWith("cocategory:")) return "同分类:" + ch.slice(11);
  if (ch.startsWith("same_host:")) return "同站点:" + ch.slice(10);
  if (ch.startsWith("thread:")) return "同线索:" + ch.slice(7);
  const BARE = { fts: "全文命中", attach: "挂接", same_host: "同站点",
                 thread: "同线索", child: "子分类", parent: "父分类",
                 host_member: "域内条目" };
  return BARE[ch] || ch;
}

async function doWorkbench(q) {
  wb.q = q; wb.focusId = null; wb.tab = "agg";
  const box = document.getElementById("hits");
  box.innerHTML = "<small>聚合中…</small>";
  const [fts, rec] = await Promise.all([
    fetch("/api/search?q=" + encodeURIComponent(q)).then(r => r.json())
      .catch(() => ({ hits: [] })),
    fetch("/api/recall", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic: q, limit: 60 }) }).then(r => r.json())
      .catch(() => ({ hits: [] })),
  ]);
  const map = new Map();
  for (const h of (fts.hits || []))
    map.set(h.entry_id, { id: h.entry_id, title: h.title, locator: h.locator,
                          snippet: h.snippet || "", channels: ["fts"] });
  for (const h of (rec.hits || [])) {
    const ex = map.get(h.entry_id);
    if (ex) {
      for (const ch of (h.channels || []))
        if (ch !== "fts" && !ex.channels.includes(ch)) ex.channels.push(ch);
    } else {
      map.set(h.entry_id, { id: h.entry_id, title: h.title, locator: h.locator,
                            snippet: "",
                            channels: (h.channels || []).filter(c => c !== "fts") });
    }
  }
  wb.merged = [...map.values()];
  renderWorkbench();
}

function renderWorkbench() {
  const box = document.getElementById("hits");
  const tabs = [["agg", `聚合结果 ${wb.merged.length}`], ["threads", "线索"], ["radiate", "放射"]];
  box.innerHTML =
    `<div id="wb-tabs">` + tabs.map(([k, label]) =>
      `<button class="wb-tab${wb.tab === k ? " on" : ""}" data-tab="${k}">${label}</button>`).join("")
    + `<span style="flex:1"></span>`
    + (wb.merged.length ? `<button id="wb-solidify" title="把当前全部结果存为线索，去串联工作区继续编排">🧵 固化为线索</button>` : "")
    + `</div><div id="wb-body"></div>`;
  box.querySelectorAll(".wb-tab").forEach(b =>
    b.onclick = () => { wb.tab = b.dataset.tab; renderWorkbench(); });
  const sf = document.getElementById("wb-solidify");
  if (sf) sf.onclick = async () => {
    const name = (prompt("线索名称：", "检索：" + wb.q) || "").trim();
    if (!name) return;
    const res = await writeJSON("/api/threads",
      { name, entry_ids: wb.merged.map(x => x.id) });
    if (res.error) { alert("失败：" + res.error.message); return; }
    location.href = "/thread.html?id=" + res.id;
  };
  if (wb.tab === "agg") renderAggTab();
  else if (wb.tab === "threads") renderThreadsTab();
  else renderRadiateTab();
}

function renderAggTab() {
  const body = document.getElementById("wb-body");
  if (!wb.merged.length) {
    body.innerHTML = "<small>无命中——换个关键词试试（聚合 = 全文检索 ∪ 主题多路召回）。</small>";
    return;
  }
  body.innerHTML = wb.merged.map(e =>
    `<div class="entry" data-id="${e.id}"><a href="${e.locator}" target="_blank" rel="noopener">${e.title}</a>`
    + e.channels.map(ch => `<span class="badge" title="关联解释：${ch.replace(/"/g, "&quot;")}">${chLabel(ch)}</span>`).join("")
    + `<button class="wb-focus-btn" data-id="${e.id}" title="以该条目为焦点进入放射视图">🎯 放射</button>`
    + (e.snippet ? `<br><small>${e.snippet}</small>` : "")
    + `</div>`).join("");
  body.querySelectorAll(".wb-focus-btn").forEach(b =>
    b.onclick = () => { wb.focusId = b.dataset.id; wb.tab = "radiate"; renderWorkbench(); });
  attachCatChips();  // 分类定位徽标
  bindEntryButtons();
}

async function renderThreadsTab() {
  const body = document.getElementById("wb-body");
  if (!wb.merged.length) { body.innerHTML = "<small>无命中，无线索可聚合。</small>"; return; }
  body.innerHTML = "<small>聚合中…</small>";
  const ids = wb.merged.map(x => x.id);
  const data = await (await fetch("/api/threads-lookup?ids=" + encodeURIComponent(ids.join(",")))).json();
  const agg = new Map();  // thread_id → {name, count}
  for (const ts of Object.values(data.map || {}))
    for (const t of ts) {
      const ex = agg.get(t.id) || { name: t.name, count: 0 };
      ex.count += 1; agg.set(t.id, ex);
    }
  body.innerHTML = agg.size
    ? [...agg.entries()].map(([tid, t]) =>
        `<div class="entry"><a href="/thread.html?id=${tid}" target="_blank" rel="noopener">🧵 ${t.name}</a>`
        + `<span class="badge">含当前结果 ${t.count} 条</span></div>`).join("")
    : `<small>当前 ${wb.merged.length} 条结果都不在线索里——点右上「🧵 固化为线索」把这次探索沉淀下来。</small>`;
}

async function renderRadiateTab() {
  const body = document.getElementById("wb-body");
  if (!wb.merged.length) { body.innerHTML = "<small>无命中，无焦点可放射。</small>"; return; }
  if (!wb.focusId || !wb.merged.some(x => x.id === wb.focusId))
    wb.focusId = wb.merged[0].id;
  body.innerHTML = "<small>放射中…</small>";
  const r = await fetch(`/api/graph/radiate?node_id=e:${wb.focusId}&per_channel=12`);
  if (r.status === 404) { body.innerHTML = "<small>焦点条目不存在（可能已舍弃）。</small>"; return; }
  const data = await r.json();
  if (!data.nodes.length) {
    body.innerHTML = `<div class="wb-radiate-focus">🎯 焦点：${data.focus.name}</div>`
      + `<small>该条目没有可放射的邻域（无挂接/同源/同线索关联）。<a href="/graph.html">去关系图总览</a></small>`;
    return;
  }
  // 按主通道分组；通道顺序固定，可读优先
  const ORDER = ["attach:", "same_host:", "thread:", "child:", "parent:", "host_member:"];
  const groups = {};
  for (const n of data.nodes) {
    const ch = (n.reasons && n.reasons[0]) || "";
    const key = ORDER.find(o => ch.startsWith(o)) || ch || "其他";
    (groups[key] = groups[key] || []).push(n);
  }
  const chTitle = key => chLabel(key.replace(/:$/, ""));
  body.innerHTML =
    `<div class="wb-radiate-focus">🎯 焦点：${data.focus.name}`
    + `　<a href="/graph.html?node=e:${wb.focusId}" target="_blank" rel="noopener">🕸️ 在图中打开</a></div>`
    + Object.keys(groups).map(key =>
        `<div class="wb-channel">${chTitle(key)}（${groups[key].length}${data.truncated && data.truncated[key.replace(":", "")] ? `，还有 ${data.truncated[key.replace(":", "")]} 条未显示` : ""}）</div>`
        + groups[key].map(n =>
            `<div class="entry"><a href="${n.locator || "#"}" target="_blank" rel="noopener">${n.name}</a>`
            + `<span class="badge" title="关联解释">${n.reasons.map(chLabel).join("；")}</span>`
            + (n.kind === "entry" ? `<button class="wb-focus-btn" data-eid="${n.id.slice(2)}" title="以该条目为新焦点继续放射">🎯 切焦点</button>` : "")
            + `</div>`).join("")).join("");
  body.querySelectorAll(".wb-focus-btn").forEach(b =>
    b.onclick = () => { wb.focusId = b.dataset.eid; renderRadiateTab(); });
}

document.getElementById("search").addEventListener("change", e => {
  const q = e.target.value.trim();
  if (q) doWorkbench(q);
});
document.getElementById("search").addEventListener("keydown", e => {
  if (e.key === "Enter") doWorkbench(e.target.value.trim());
});
