<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>知道 KnowAtlas</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0;
         display: flex; height: 100vh; }
  aside { width: 320px; overflow: auto; border-inline-end: 1px solid #8884;
          padding: 12px; }
  main { flex: 1; overflow: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  small { color: #888; }
  #search { width: 100%; box-sizing: border-box; padding: 6px; margin: 8px 0; }
  .tree-node { margin: 2px 0 2px 12px; }
  .tree-node > .name { cursor: pointer; }
  .tree-node > .name:hover { text-decoration: underline; }
  .hit { margin: 8px 0; padding: 6px 8px; border: 1px solid #8884; border-radius: 6px; }
  .hit a { font-weight: 600; }
</style>
</head>
<body>
<aside>
  <h1>知道 KnowAtlas</h1>
  <small>个人知识统一索引 · 分类树（M0.5 最小界面）</small>
  <input id="search" placeholder="全文检索（≥3 字走 FTS，两字词自动兜底）">
  <div id="tree">加载中…</div>
</aside>
<main>
  <div id="hits"><small>在左侧搜索；点击分类查看该分支暂无条目列表（M0.5 演进中）。</small></div>
</main>
<script>
async function loadTree() {
  const r = await fetch("/api/tree");
  const data = await r.json();
  const box = document.getElementById("tree");
  box.textContent = "";
  const render = (nodes, parent) => {
    for (const n of nodes) {
      const div = document.createElement("div");
      div.className = "tree-node";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = n.name;
      div.appendChild(name);
      parent.appendChild(div);
      render(n.children, div);
    }
  };
  render(data.tree, box);
  if (!data.tree.length) box.innerHTML = "<small>暂无分类；用 kadd 收录第一批链接。</small>";
}
document.getElementById("search").addEventListener("change", async (e) => {
  const q = e.target.value.trim();
  if (!q) return;
  const r = await fetch("/api/search?q=" + encodeURIComponent(q));
  const data = await r.json();
  const box = document.getElementById("hits");
  box.innerHTML = data.hits.length
    ? data.hits.map(h =>
        `<div class="hit"><a href="${h.locator}" target="_blank" rel="noopener">${h.title}</a><br><small>${h.snippet || ""}</small></div>`
      ).join("")
    : "<small>无命中。</small>";
});
loadTree();
</script>
</body>
</html>
