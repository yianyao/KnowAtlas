<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>知道 KnowAtlas</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0;
         display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  /* 顶栏（第五十九批页签化）：品牌 + 全局搜索 + 收录 + 设置 */
  #topbar { display: flex; gap: 10px; align-items: center; padding: 8px 16px;
            border-bottom: 1px solid #8884; flex: none; }
  #brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
  #search { flex: 1; max-width: 620px; box-sizing: border-box; padding: 6px 10px; }
  #ingest-btn { cursor: pointer; border: 1px solid #4a9eff88; border-radius: 4px;
                background: transparent; color: #4a9eff; font-size: 13px;
                padding: 5px 14px; white-space: nowrap; }
  #side-collapse { cursor: pointer; border: 1px solid #8886; border-radius: 4px;
                   background: transparent; color: inherit; font-size: 12px;
                   padding: 3px 8px; flex: none; }
  #settings { position: relative; flex: none; }
  #settings summary { cursor: pointer; list-style: none; font-size: 15px; padding: 2px 6px; }
  #settings summary::-webkit-details-marker { display: none; }
  #settings > div { position: absolute; right: 0; top: 28px; z-index: 80;
                    background: Canvas; border: 1px solid #8888; border-radius: 8px;
                    padding: 10px 14px; box-shadow: 0 2px 10px #0003; white-space: nowrap;
                    font-size: 13px; }
  /* 左栏：仅分类树（58 批默认折叠纪律保留，折叠键在顶栏） */
  #layout { display: flex; flex: 1; min-height: 0; }
  aside { width: 340px; flex: none; overflow: auto; border-inline-end: 1px solid #8884;
          padding: 12px; }
  body.side-hide aside { display: none; }
  aside small { color: #888; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0;
         padding: 0 16px 16px; overflow: hidden; }
  /* 页签行（第五十九批）：检索默认 / 关系图 / 串联 / 词云 / 时间线 / 管理 */
  #view-tabs { display: flex; gap: 4px; align-items: center; flex: none;
               border-bottom: 1px solid #8884; overflow-x: auto; }
  .vtab { cursor: pointer; border: 1px solid #8886; border-bottom: none;
          border-radius: 6px 6px 0 0; background: transparent; color: inherit;
          font-size: 13px; padding: 5px 16px; white-space: nowrap; flex: none; }
  .vtab.on { border-bottom: 1px solid Canvas; margin-bottom: -1px;
             font-weight: 600; color: #4a9eff; }
  .view { flex: 1; min-height: 0; overflow: auto; padding-top: 10px; }
  .view[hidden] { display: none; }
  .view iframe { width: 100%; height: 100%; border: 0; display: block; }
  #view-graph, #view-thread { padding-top: 0; }
  small { color: #888; }
  /* 管理页二级页签（第五十九批：暂存/待清理/失效/时效/已舍弃/数据管理集中） */
  #mgmt-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 2px; }
  .mtab { cursor: pointer; border: 1px solid #8886; border-radius: 4px;
          background: transparent; color: inherit; font-size: 12px; padding: 3px 12px; }
  .mtab.on { border-color: #4a9eff; color: #4a9eff; font-weight: 600; }
  /* 工作台子页签（检索视图内：聚合结果 / 线索 / 放射） */
  .wb-tab { cursor: pointer; border: 1px solid #8886; border-radius: 4px 4px 0 0;
            background: transparent; color: inherit; font-size: 13px; padding: 4px 12px; }
  .wb-tab.on { border-bottom-color: transparent; font-weight: 600; color: #4a9eff; }
  #wb-tabs { display: flex; gap: 4px; align-items: center; margin: 10px 0 0;
             border-bottom: 1px solid #8884; padding-bottom: 0; }
  #wb-tabs button { cursor: pointer; }
  #wb-solidify { border: 1px solid #4a9eff55; border-radius: 4px; background: none;
                 color: #4a9eff; font-size: 12px; padding: 3px 10px; margin-bottom: 4px; }
  #wb-body { padding-top: 10px; }
  .wb-radiate-focus { font-weight: 700; margin-bottom: 6px; }
  .wb-channel { margin: 10px 0 4px; font-size: 12px; color: #888;
                border-bottom: 1px dashed #8884; padding-bottom: 2px; }
  .wb-focus-btn { cursor: pointer; border: 1px solid #8886; border-radius: 4px;
                  background: transparent; color: inherit; font-size: 11px;
                  padding: 0 6px; margin-left: 6px; }
  .tree-node { margin: 2px 0 2px 12px; }
  .tree-node > .row { display: flex; align-items: center; gap: 6px; }
  .tree-node > .row > .name { cursor: pointer; }
  .tree-node > .row > .name:hover { text-decoration: underline; }
  .tree-node > .row > .name.active { font-weight: 700; }
  .tree-node > .row > .name.empty { opacity: .5; font-style: italic; }
  .tree-node > .row > .ops { display: none; gap: 2px; }
  .tree-node > .row:hover > .ops { display: inline-flex; }
  .ops button { cursor: pointer; border: 1px solid #8886; border-radius: 4px;
                background: transparent; color: inherit; font-size: 11px;
                padding: 0 4px; }
  .crumb { margin-bottom: 10px; }
  .crumb span { cursor: pointer; color: #4a9eff; }
  .entry { margin: 8px 0; padding: 6px 8px; border: 1px solid #8884; border-radius: 6px; }
  .entry a { font-weight: 600; }
  /* 知识集分组（第六十批）：组头 = 成员自身信号（共享词/分类/host/摘句） */
  .set-group { border: 1px solid #8884; border-inline-start: 3px solid #4a9eff;
               border-radius: 6px; padding: 6px 10px 2px; margin: 12px 0; }
  .set-head { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline;
              margin-bottom: 4px; }
  .set-head .badge { margin-left: 0; }
  .sig-word { color: #2b8fb3; border-color: #2b8fb366; }
  .sig-category { color: #4a9eff; border-color: #4a9eff66; }
  .sig-host { color: #8d5aa8; border-color: #8d5aa866; }
  .set-excerpt { font-size: 12px; color: #888; margin: 2px 0 8px; }
  .set-note { display: block; margin-bottom: 6px; }
  .badge { display: inline-block; font-size: 11px; border: 1px solid #8886;
           border-radius: 4px; padding: 0 4px; margin-left: 6px; color: #888; }
  .cat-chip { display: inline-block; font-size: 11px; color: #4a9eff;
              border: 1px dashed #4a9eff66; border-radius: 4px; padding: 0 6px;
              margin-left: 6px; cursor: pointer; }
  .cat-chip:hover { background: #4a9eff22; }
  .tree-node > .row > .name.flash { animation: catflash 1.1s ease 2; }
  @keyframes catflash { 0%, 100% { background: transparent; }
                        45% { background: #4a9eff55; } }
  .move-btn, .reject-btn { cursor: pointer; border: 1px solid #8886; border-radius: 4px;
              background: transparent; color: inherit; font-size: 11px;
              padding: 0 6px; margin-left: 6px; display: none; }
  .entry:hover .move-btn, .entry:hover .reject-btn { display: inline-block; }
  .confirm-btn { cursor: pointer; border: 1px solid #4a9eff66; border-radius: 4px;
              background: transparent; color: #4a9eff; font-size: 11px;
              padding: 0 6px; margin-left: 6px; display: none; }
  .entry:hover .confirm-btn { display: inline-block; }
  /* 人工校正：拖拽落点提示 + 多选模式（第五十二批） */
  .tree-node > .row > .name.drop-hint { outline: 2px dashed #4a9eff; outline-offset: 1px; }
  .entry { cursor: default; }
  .entry .sel-cb { display: none; margin-right: 6px; vertical-align: -2px; }
  body.multiselect .entry .sel-cb { display: inline-block; }
  #bulk-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px;
              background: Canvas; border: 1px solid #8888; border-radius: 8px;
              padding: 8px 14px; display: flex; gap: 10px; align-items: center;
              box-shadow: 0 2px 10px #0003; z-index: 50; font-size: 13px; }
  #bulk-bar button { cursor: pointer; border: 1px solid #8886; border-radius: 4px;
                     background: transparent; color: inherit; padding: 2px 10px; }
  #bulk-bar button.primary { border-color: #4a9eff88; color: #4a9eff; }
  #filter { margin: 8px 0; }
  /* 词云视图（第四十三批） */
  .cloud-scope { font-size: 13px; margin: 4px 0 10px; }
  .cloud-cats { margin-bottom: 12px; }
  .cloud-cat { cursor: pointer; margin: 0 6px 6px 0; padding: 4px 10px; font-size: 13px;
               border: 1px solid #8886; border-radius: 12px; background: transparent;
               color: inherit; }
  .cloud-cat:hover { border-color: #4a9eff; color: #4a9eff; }
  .cloud-words { line-height: 1.9; margin-bottom: 12px; }
  .cloud-word { cursor: pointer; margin: 0 10px 4px 0; display: inline-block; }
  .cloud-word:hover { text-decoration: underline; }
  #cloud-facet .entry { margin: 4px 0; }
  /* 时间线视图（第四十四批） */
  .tl-scope { font-size: 13px; margin: 4px 0 10px; }
  .tl-gran { cursor: pointer; margin: 0 4px; padding: 2px 8px; font-size: 12px;
             border: 1px solid #8886; border-radius: 10px; background: transparent; color: inherit; }
  .tl-gran.on { border-color: #4a9eff; color: #4a9eff; }
  #tl-chart { width: 100%; height: 280px; margin: 4px 0 10px; }
  .tl-stale { font-size: 13px; margin-top: 14px; border-top: 1px solid #8884; padding-top: 10px; }
  .tl-branch { display: flex; align-items: center; gap: 8px; margin: 5px 0; flex-wrap: wrap; }
  .tl-branch .nm { font-weight: 600; }
  .tl-branch .age { color: #d1495b; font-size: 12px; }
  .tl-locate { cursor: pointer; font-size: 12px; padding: 2px 8px;
               border: 1px solid #8886; border-radius: 10px; background: transparent; color: inherit; }
  .tl-locate:hover { border-color: #4a9eff; color: #4a9eff; }
  #tl-bucket .entry { margin: 4px 0; }
  /* bookmarklet 左缘小书签坞（第五十九批）：默认收缩、悬停展开（用户批注） */
  #bm-dock { position: fixed; left: 0; bottom: 88px; z-index: 70; }
  #bm-tab { writing-mode: vertical-rl; letter-spacing: 3px; font-size: 12px;
            background: Canvas; border: 1px solid #8888; border-left: none;
            border-radius: 0 8px 8px 0; padding: 10px 3px; cursor: pointer; opacity: .7; }
  #bm-dock:hover #bm-tab { opacity: 1; }
  #bm-panel { display: none; position: absolute; left: 26px; bottom: 0; width: 260px;
              background: Canvas; border: 1px solid #8888; border-radius: 8px;
              padding: 10px 12px; box-shadow: 0 2px 10px #0003; font-size: 13px; }
  #bm-dock:hover #bm-panel, #bm-dock.dragging #bm-panel { display: block; }
  #bm-panel a { display: block; margin: 6px 0; }
  dialog { border: 1px solid #8888; border-radius: 8px; padding: 16px;
           background: Canvas; color: CanvasText; min-width: 320px; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog input { width: 100%; box-sizing: border-box; padding: 6px; margin: 8px 0; }
  dialog .btns { display: flex; gap: 8px; justify-content: flex-end; }
  dialog button { cursor: pointer; padding: 4px 12px; }
</style>
</head>
<body>
<header id="topbar">
  <button id="side-collapse" title="收起左栏（快捷键 [ ）">◀</button>
  <span id="brand">知道 KnowAtlas</span>
  <input id="search" placeholder="输入主题词，回车检索（聚合 / 线索 / 放射）" autocomplete="off">
  <button id="ingest-btn" title="同 kadd：抓正文 → 归类 → 索引">＋ 收录</button>
  <details id="settings">
    <summary title="设置">⚙</summary>
    <div>
      <label style="display:block;cursor:pointer;user-select:none">
        <input type="checkbox" id="show-empty-cats"> 显示空分类
      </label>
    </div>
  </details>
</header>
<div id="layout">
<aside>
  <small>分类树（点击下钻；悬停节点出现管理按钮；可拖条目到节点改挂）</small>
  <div id="tree">加载中…</div>
</aside>
<main>
  <nav id="view-tabs">
    <button class="vtab on" data-view="search">检索</button>
    <button class="vtab" data-view="graph">关系图</button>
    <button class="vtab" data-view="thread">线索库</button>
    <button class="vtab" data-view="cloud">词云</button>
    <button class="vtab" data-view="timeline">时间线</button>
    <button class="vtab" data-view="mgmt">管理</button>
  </nav>
  <section id="view-search" class="view">
    <div id="crumb"></div>
    <select id="filter" style="display:none">
      <option value="">全部来源</option>
      <option value="bookmark">书签</option>
      <option value="manual">手动</option>
    </select>
    <div id="hits" class="entry-host"><small>点击左侧分类查看条目；或输入关键词全文检索。</small></div>
  </section>
  <section id="view-graph" class="view" hidden>
    <iframe id="graph-frame" data-src="/graph.html" title="知识关系图"></iframe>
  </section>
  <section id="view-thread" class="view" hidden>
    <iframe id="thread-frame" data-src="/thread.html" title="线索库"></iframe>
  </section>
  <section id="view-cloud" class="view" hidden>
    <div id="cloud-view" class="entry-host"></div>
  </section>
  <section id="view-timeline" class="view" hidden>
    <div id="timeline-view" class="entry-host"></div>
  </section>
  <section id="view-mgmt" class="view" hidden>
    <nav id="mgmt-tabs">
      <button class="mtab" data-sub="staged">📥 暂存区</button>
      <button class="mtab" data-sub="nonk">🔬 待清理</button>
      <button class="mtab" data-sub="dead">☠️ 失效链接</button>
      <button class="mtab" data-sub="fresh">⏳ 时效候选</button>
      <button class="mtab" data-sub="rejected">🗑️ 已舍弃</button>
      <button class="mtab" data-sub="data">🛠 数据管理</button>
    </nav>
    <div id="mgmt-desc" style="font-size:12px;color:#888;margin:8px 0"></div>
    <div id="mgmt-body" class="entry-host"></div>
  </section>
</main>
</div>
<div id="bulk-bar" style="display:none">
  <label style="cursor:pointer"><input type="checkbox" id="ms-toggle" style="vertical-align:-2px"> 多选</label>
  <span id="ms-count">已选 0</span>
  <button id="ms-move" class="primary">移到…</button>
  <button id="ms-cancel">取消</button>
</div>
<!-- bookmarklet 左缘小书签坞（第五十九批）：默认收缩到左缘，悬停展开显示用途；
     拖到书签栏后任意网页一键收录。拖拽期间保持展开。 -->
<div id="bm-dock">
  <div id="bm-tab" title="收藏小书签">📮 收藏</div>
  <div id="bm-panel">
    <b>📮 收藏小书签</b>
    <a id="bookmarklet" href="#" title="把本链接拖到浏览器书签栏">📮 收藏小书签（拖到书签栏）</a>
    <small>拖到浏览器书签栏后，在任意网页点它一下即收进本库（走同 kadd 的抓取 → 归类链路）。</small>
  </div>
</div>
<dialog id="move-dialog">
  <form method="dialog" id="move-form">
    <div id="move-title" style="font-weight:600"></div>
    <input id="move-input" list="catlist" placeholder="输入或从列表选择分类路径" autocomplete="off">
    <datalist id="catlist"></datalist>
    <label style="display:block;font-size:12px;margin-top:6px;cursor:pointer">
      <input type="checkbox" id="move-keep" style="vertical-align:-2px"> 保留原挂接（多父挂接——同一知识挂到多个分支）
    </label>
    <div class="btns">
      <button type="button" id="move-cancel">取消</button>
      <button type="submit" id="move-ok">确定</button>
    </div>
  </form>
</dialog>
<dialog id="ingest-dialog">
  <div style="font-weight:600;margin-bottom:4px">＋ 收录网页</div>
  <input id="add-url" placeholder="粘贴 http(s) 网址，手动收录（同 kadd：抓正文→归类→入树）" autocomplete="off">
  <div id="add-url-out" style="font-size:12px;color:#888;margin:8px 0;word-break:break-all"></div>
  <div class="btns">
    <button type="button" id="ingest-close">关闭</button>
    <button type="button" id="add-url-btn">收录</button>
  </div>
</dialog>
<script src="/vendor/echarts.min.js"></script>
<script>
let pathToId = {};     // 派生路径 → 分类 id（供移动/合并输入目标）
let currentCat = null; // 当前选中分类 id
let refreshCurrent = null; // 当前视图刷新器——写操作成功后局部刷新，不跳转
let showEmptyCats = localStorage.getItem("knowatlas-show-empty") === "1"; // 空分类默认不占视线
let curView = "search";    // 当前顶层页签
let mgmtCurrent = "staged"; // 管理页当前子页签

function token() { return localStorage.getItem("knowatlas_token") || ""; }
// 页面打开时向服务端要一次同源写凭据（服务端种 HttpOnly Cookie，浏览器自动携带）。
// 令牌由服务端环境变量决定，用户**不需要手工填任何令牌**。
let sessionInfo = {};
async function ensureSession() {
  try { sessionInfo = await (await fetch("/api/session")).json(); } catch { sessionInfo = {}; }
  return sessionInfo;
}
async function writeJSON(url, body) {
  // 兜底：仅当服务端未配置令牌（理论上 serve 启动即自动生成，实践中不会发生）
  if (sessionInfo && sessionInfo.configured === false) {
    const t = prompt("服务端未读到写令牌环境变量，无法写操作。\n请在启动 serve 的终端查看令牌提示。");
    if (t === null) return { __aborted: true };
    localStorage.setItem("knowatlas_token", t.trim());
  }
  const r = await fetch(url, { method: "POST",
    headers: { "Content-Type": "application/json", "X-KnowAtlas-Token": token() },
    body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 403 && data && data.error && data.error.code === "FORBIDDEN") {
    // 凭据失效（例如 serve 重启后换了令牌）——重取一次会话再试，仍失败才提示
    await ensureSession();
    const retry = await fetch(url, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (retry.ok) return retry.json();
  }
  // 非 2xx 且无 error 字段（FastAPI 默认 404/500 是 {"detail": ...}）——
  // 规范化成 error 结构，防调用方 !res.error 误判成功（第五十一批修：
  // confirm-category 404 在旧后端进程上曾显示"✓已确认"假成功）
  if (!r.ok && data && !data.error) {
    data.error = { code: "HTTP_" + r.status, message: data.detail || ("HTTP " + r.status) };
  }
  return data;
}

async function loadTree() {
  const data = await (await fetch("/api/tree")).json();
  pathToId = {};
  // 下拉（移动/合并目标）只收非空分类——把条目搬进/合进空分类没有意义；
  // count 缺失（旧后端进程）时放行，不误杀
  const collect = (nodes) => { for (const n of nodes) {
    if (n.count === undefined || n.count > 0) pathToId[n.path] = n.id;
    collect(n.children); } };
  collect(data.tree);
  document.getElementById("catlist").innerHTML =
    Object.keys(pathToId).map(p => `<option value="${p}">`).join("");
  const box = document.getElementById("tree");
  box.textContent = "";
  const render = (nodes, parent, prefix) => {
    for (const n of nodes) {
      if (n.count === 0 && !showEmptyCats) continue;  // 空枝默认隐藏（count 缺失≠空，防旧后端误杀）
      const div = document.createElement("div");
      div.className = "tree-node";
      const row = document.createElement("div"); row.className = "row";
      const name = document.createElement("span");
      const path = prefix ? `${prefix}/${n.name}` : n.name;
      name.className = "name" + (n.id === currentCat ? " active" : "")
                     + (n.count === 0 ? " empty" : "");
      if (n.count === 0) name.title = "该分类（含子分类）下暂无 active 条目";
      name.textContent = n.name;
      name.onclick = () => showCategory(n.id);
      nodeEls[n.id] = name;  // 双向联动②：供条目徽标点击时定位
      name.dataset.path = path;  // 拖拽落点（第五十二批）：条目拖到节点=改挂该分类
      name.addEventListener("dragover", e => { e.preventDefault(); name.classList.add("drop-hint"); });
      name.addEventListener("dragleave", () => name.classList.remove("drop-hint"));
      name.addEventListener("drop", e => {
        e.preventDefault(); name.classList.remove("drop-hint");
        const ids = JSON.parse(e.dataTransfer.getData("text/knowatlas-ids") || "[]");
        if (ids.length) opRecategorize(ids, "", path);
      });
      const ops = document.createElement("span"); ops.className = "ops";
      const mk = (label, title, fn) => {
        const b = document.createElement("button");
        b.textContent = label; b.title = title; b.onclick = (e) => { e.stopPropagation(); fn(n); };
        return b;
      };
      ops.appendChild(mk("＋", "新建子分类", opAddChild));
      ops.appendChild(mk("✎", "重命名", opRename));
      ops.appendChild(mk("⇄", "移动到另一分类（输入目标路径）", opMove));
      ops.appendChild(mk("⇒", "合并进另一分类（输入目标路径）", opMerge));
      row.appendChild(name); row.appendChild(ops);
      div.appendChild(row);
      parent.appendChild(div);
      render(n.children, div, path);
    }
  };
  render(data.tree, box, "");
  if (!data.tree.length) box.innerHTML = "<small>暂无分类；用 kadd / ksync 收录第一批条目。</small>";
}

async function opAddChild(n) {
  const name = prompt(`在「${n.name}」下新建子分类，名称：`);
  if (!name) return;
  const res = await writeJSON("/api/categories", { name, parent_ids: [n.id] });
  if (!res.__aborted && !res.error) loadTree();
  else if (res.error) alert("失败：" + res.error.message);
}
async function opRename(n) {
  const name = prompt(`重命名「${n.name}」为：`, n.name);
  if (!name || name === n.name) return;
  const res = await writeJSON(`/api/categories/${n.id}/rename`, { name });
  if (!res.__aborted && !res.error) loadTree();
  else if (res.error) alert("失败：" + res.error.message);
}
async function opMove(n) {
  const p = prompt(`移动「${n.name}」到目标分类（输入其完整路径如 技术开发/前端；留空 = 移到顶层）：`);
  if (p === null) return;
  const pid = pathToId[p.trim()];
  if (p.trim() && !pid) { alert("目标路径不存在：" + p); return; }
  const res = await writeJSON(`/api/categories/${n.id}/move`, { parent_ids: pid ? [pid] : [] });
  if (!res.__aborted && !res.error) loadTree();
  else if (res.error) alert("失败：" + res.error.message);
}
async function opMerge(n) {
  const p = prompt(`把「${n.name}」合并进目标分类（其条目与子树并入，本分类删除）。目标完整路径：`);
  if (!p) return;
  const tid = pathToId[p.trim()];
  if (!tid) { alert("目标路径不存在：" + p); return; }
  if (!confirm(`确认把「${n.name}」合并进「${p}」？该操作不可自动撤销。`)) return;
  const res = await writeJSON(`/api/categories/${n.id}/merge`, { target_id: tid });
  if (!res.__aborted && !res.error) { if (currentCat === n.id) currentCat = null; loadTree(); }
  else if (res.error) alert("失败：" + res.error.message);
}

const SRC_LABEL = { folder: "文件", bookmark: "书签", manual: "手动", emmx: "脑图", mail: "邮件", expand: "扩散", opml: "OPML" };
function srcLabel(t) { return SRC_LABEL[t] || t; }
function entryHTML(e) {
  return `<div class="entry" data-id="${e.id}"><a href="${e.locator}" target="_blank" rel="noopener">${e.title}</a>`
       + `<span class="badge">${srcLabel(e.source_type)}</span>`
       + `<button class="move-btn" data-id="${e.id}" data-title="${e.title.replace(/"/g, "&quot;")}">⇄改分类</button>`
       + `<button class="reject-btn" data-id="${e.id}" data-title="${e.title.replace(/"/g, "&quot;")}">🚫舍弃</button></div>`;
}
function bindEntryButtons() {
  document.querySelectorAll(".move-btn").forEach(b => b.onclick = () => opRecategorize(b.dataset.id, b.dataset.title));
  document.querySelectorAll(".reject-btn").forEach(b => b.onclick = () => opReject(b.dataset.id, b.dataset.title));
  // 复制条目 ID（第四十二批）：统一注入到所有带 data-id 的条目行——
  // 检索/词云切面/时间线桶/管理页等全部 entry-host 视图自动获得，无需逐视图改模板。
  // 主要用途：拿 id 跑 ksync --expand <entry_id> 扩散抓取。
  document.querySelectorAll(".entry-host .entry[data-id]").forEach(d => {
    if (d.querySelector(".cid-btn")) return;
    d.insertAdjacentHTML("beforeend",
      `<button class="cid-btn" data-id="${d.dataset.id}" title="复制条目 ID（ksync --expand 等命令用）">🆔</button>`);
  });
  document.querySelectorAll(".cid-btn").forEach(b => b.onclick = () => {
    navigator.clipboard.writeText(b.dataset.id)
      .then(() => { b.textContent = "✓"; setTimeout(() => b.textContent = "🆔", 800); })
      .catch(() => { prompt("复制失败，请手动复制条目 ID：", b.dataset.id); });
  });
  attachCatChips();  // 双向联动②：条目 → 分类定位徽标（所有条目视图统一挂）
}
// 双向联动②：条目列表点「📁分类路径」徽标 → 左树滚动定位 + 闪烁高亮。
// （双向联动①：点树节点 → 右侧条目列表，showCategory 已有）
const nodeEls = {};  // 分类 id → 树节点元素（loadTree 渲染时登记）
function highlightInTree(catId) {
  const el = nodeEls[catId];
  if (!el) return;  // 未渲染（被空枝过滤等）→ 静默跳过
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("flash"); void el.offsetWidth;  // 强制重排以重启动画
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 2400);
}
async function attachCatChips() {
  const divs = [...document.querySelectorAll(".entry-host .entry[data-id]")];
  if (!divs.length) return;
  const ids = [...new Set(divs.map(d => d.dataset.id))].slice(0, 100);
  const data = await (await fetch("/api/entries/linkage?ids=" + ids.join(","))).json();
  if (!data.linkage) return;
  for (const div of divs) {
    const cats = data.linkage[div.dataset.id];
    if (!cats || !cats.length) continue;
    div.insertAdjacentHTML("beforeend", cats.map(c =>
      `<span class="cat-chip" data-cid="${c.category_id}" title="点击在左侧树中定位该分类">📁${c.path}</span>`).join(""));
    // 确认归类（第五十一批回归集）：有挂接的条目注入 ✓ 按钮——把当前主分类
    // （manual 优先，服务端裁决）确认为回归集期望；暂存区条目不注入。
    if (!div.querySelector(".confirm-btn")) div.insertAdjacentHTML("beforeend",
      `<button class="confirm-btn" data-id="${div.dataset.id}" title="确认当前归类正确（进回归集，ktest regress 用）">✓</button>`);
  }
  document.querySelectorAll(".entry-host .cat-chip").forEach(ch =>
    ch.onclick = () => highlightInTree(ch.dataset.cid));
  // 确认归类（第五十一批回归集）：绑定 ✓ 按钮（onclick 赋值幂等，重复绑定
  // 无害；不回调 bindEntryButtons——它尾部调 attachCatChips，会死循环）。
  document.querySelectorAll(".confirm-btn").forEach(b => b.onclick = async () => {
    const res = await writeJSON(`/api/entries/${b.dataset.id}/confirm-category`, {});
    if (!res.__aborted && !res.error) {
      b.textContent = "✓已确认"; setTimeout(() => { b.textContent = "✓"; }, 1200);
    } else if (res.error) alert("确认失败：" + res.error.message);
  });
  // 人工校正（第五十二批）：条目行统一注入多选框 + 拖拽源——所有生成
  // .entry[data-id] 的视图（分类/暂存/检索/词云切面/管理页等）自动生效。
  document.querySelectorAll(".entry-host .entry[data-id]").forEach(d => {
    if (!d.querySelector(".sel-cb")) d.insertAdjacentHTML("afterbegin",
      `<input type="checkbox" class="sel-cb" data-id="${d.dataset.id}" title="加入多选">`);
    d.draggable = true;
    d.ondragstart = (e) => {
      // 已有选择集且当前条目在集内 → 拖整个选择集；否则拖单条
      const checked = currentSelection();
      const ids = checked.includes(d.dataset.id) ? checked : [d.dataset.id];
      e.dataTransfer.setData("text/knowatlas-ids", JSON.stringify(ids));
      e.dataTransfer.effectAllowed = "move";
    };
    const cb = d.querySelector(".sel-cb");
    cb.checked = selection.has(d.dataset.id);
    cb.onchange = () => { cb.checked ? selection.add(d.dataset.id) : selection.delete(d.dataset.id); updateBulkBar(); };
  });
}

// （只追加不摘旧）；prefill 预填目标路径（拖拽场景=拖到的树节点路径）。
let moveTargets = [];
function opRecategorize(entryIds, title, prefill = "") {
  moveTargets = Array.isArray(entryIds) ? entryIds : [entryIds];
  const label = moveTargets.length > 1 ? `${moveTargets.length} 条条目` : `「${String(title).slice(0, 60)}」`;
  document.getElementById("move-title").textContent = `把 ${label} 移到：`;
  document.getElementById("move-input").value = prefill;
  document.getElementById("move-keep").checked = false;
  document.getElementById("move-dialog").showModal();
}

document.getElementById("move-form").onsubmit = async (e) => {
  e.preventDefault();
  const p = document.getElementById("move-input").value.trim().replace(/^\/+|\/+$/g, "");
  const keep = document.getElementById("move-keep").checked;
  if (!p || !moveTargets.length) return;
  let res;
  if (moveTargets.length === 1) {
    res = await writeJSON(`/api/entries/${moveTargets[0]}/recategorize`, { target_path: p, keep_existing: keep });
  } else {
    res = await writeJSON("/api/entries/batch-recategorize", { entry_ids: moveTargets, target_path: p, keep_existing: keep });
  }
  document.getElementById("move-dialog").close();
  if (res.error) { alert("失败：" + res.error.message); return; }
  if (res.skipped && res.skipped.length) alert(`完成 ${res.done.length} 条；跳过 ${res.skipped.length} 条（条目不存在）`);
  clearSelection();
  // 留在当前视图，只局部刷新（不跳转）
  refreshCurrent ? refreshCurrent() : loadTree();
}

  const res = await writeJSON(`/api/entries/${entryId}/reject`, {});
  if (res.error) { alert("失败：" + res.error.message); return; }
  refreshCurrent ? refreshCurrent() : loadTree();
}

// ---- 统一入口工作台（第三十四批，契约 §9.4：模式是视图切换，不是启动分叉） ----
// 检索提交后同时拉 FTS、topic_recall 与 hybrid（sim 通道，第六十批），按条目
// 去重合并，三视图共享同一份结果：聚合结果（带关联解释；命中多时按知识集
// 分组展示，第六十批）/ 线索（命中条目所属线索聚合） / 放射（焦点邻域持续下钻）。
const wb = { q: "", merged: [], tab: "agg", focusId: null,
             groups: null, singles: null, gmode: "" };

function chLabel(ch) {
  if (ch.startsWith("cocategory:")) return "同分类:" + ch.slice(11);
  if (ch.startsWith("same_host:")) return "同站点:" + ch.slice(10);
  if (ch.startsWith("thread:")) return "同线索:" + ch.slice(7);
  if (ch.startsWith("sim:")) return "语义相关 " + ch.slice(4);
  const BARE = { fts: "全文命中", attach: "挂接", same_host: "同站点",
                 thread: "同线索", child: "子分类", parent: "父分类",
                 host_member: "域内条目" };
  return BARE[ch] || ch;
}

async function doWorkbench(q) {
  showView("search");
  wb.q = q; wb.focusId = null; wb.tab = "agg";
  wb.groups = null; wb.singles = null; wb.gmode = "";
  const box = document.getElementById("hits");
  box.innerHTML = "<small>聚合中…</small>";
  const [fts, rec, hyb] = await Promise.all([
    fetch("/api/search?q=" + encodeURIComponent(q)).then(r => r.json())
      .catch(() => ({ hits: [] })),
    fetch("/api/recall", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic: q, limit: 60 }) }).then(r => r.json())
      .catch(() => ({ hits: [] })),
    // sim 通道（第六十批）：混合检索的语义命中并入合并结果（向量侧
    // reasons=sim:<余弦>；embedding 未启用时该路响应降级 fts，无新信息）
    fetch("/api/search?mode=hybrid&q=" + encodeURIComponent(q)).then(r => r.json())
      .catch(() => ({ hits: [] })),
  ]);
  const map = new Map();
  for (const h of (fts.hits || []))
    map.set(h.entry_id, { id: h.entry_id, title: h.title, locator: h.locator,
                          snippet: h.snippet || "", channels: ["fts"] });
  for (const h of (hyb.hits || [])) {
    const sims = (h.reasons || []).filter(r => r.startsWith("sim:"));
    if (!sims.length) continue;              // 纯 fts 命中第一路已有
    const ex = map.get(h.entry_id);
    if (ex) { for (const s of sims) if (!ex.channels.includes(s)) ex.channels.push(s); }
    else map.set(h.entry_id, { id: h.entry_id, title: h.title, locator: h.locator,
                               snippet: h.snippet || "", channels: sims });
  }
  for (const h of (rec.hits || [])) {
    const ex = map.get(h.entry_id);
    if (ex) {
      for (const ch of (h.channels || []))
        if (ch !== "fts" && !ex.channels.includes(ch)) ex.channels.push(ch);
    } else {
      map.set(h.entry_id, { id: h.entry_id, title: h.title, locator: h.locator,
                            snippet: "",
                            channels: (h.channels || []).filter(c => c !== "fts") });
    }
  }
  wb.merged = [...map.values()];
  // 知识集聚合（第六十批，§7.3 分层查询）：命中多（>5）先给集概览，
  // 少则直接给点。聚合失败/不成组 → 平铺兜底。
  if (wb.merged.length > 5) {
    try {
      const g = await (await fetch("/api/sets/group?ids=" +
        encodeURIComponent(wb.merged.map(x => x.id).join(",")))).json();
      if (g.groups && g.groups.length) {
        const byId = new Map(wb.merged.map(x => [x.id, x]));
        const toCard = x => byId.get(x.id) || { ...x, channels: [], snippet: "" };
        wb.gmode = g.mode || "";
        wb.groups = g.groups.map(gr => ({ ...gr, entries: gr.entries.map(toCard) }));
        wb.singles = (g.singles || []).map(toCard);
      }
    } catch (e) { /* 聚合不可用 → 平铺 */ }
  }
  renderWorkbench();
}

function renderWorkbench() {
  const box = document.getElementById("hits");
  const tabs = [["agg", `聚合结果 ${wb.merged.length}`], ["threads", "线索"], ["radiate", "放射"]];
  box.innerHTML =
    `<div id="wb-tabs">` + tabs.map(([k, label]) =>
      `<button class="wb-tab${wb.tab === k ? " on" : ""}" data-tab="${k}">${label}</button>`).join("")
    + `<span style="flex:1"></span>`
    + (wb.merged.length ? `<button id="wb-solidify" title="把当前全部结果存为线索，去线索库继续编排">🧵 固化为线索</button>` : "")
    + `</div><div id="wb-body"></div>`;
  box.querySelectorAll(".wb-tab").forEach(b =>
    b.onclick = () => { wb.tab = b.dataset.tab; renderWorkbench(); });
  const sf = document.getElementById("wb-solidify");
  if (sf) sf.onclick = async () => {
    const name = (prompt("线索名称：", "检索：" + wb.q) || "").trim();
    if (!name) return;
    const res = await writeJSON("/api/threads",
      { name, entry_ids: wb.merged.map(x => x.id) });
    if (res.error) { alert("失败：" + res.error.message); return; }
    openThread(res.id);  // 页签内打开线索库（不再整页跳转）
  };
  if (wb.tab === "agg") renderAggTab();
  else if (wb.tab === "threads") renderThreadsTab();
  else renderRadiateTab();
}

// ---- 词云视图（第四十三批：scoped cloud 三态词元） ----
// 范围 = 左侧树当前焦点分类子树（currentCat；null=全库），随焦点切换；
// 分类词元点击 → 进入子分类（currentCat 同步 + 树定位高亮 + 词云刷新）；
// 内容词元点击 → facet 过滤当前范围（出条目列表，复用统一条目渲染）。
let cloudWord = null;  // 当前 facet 词（null=无 facet）
async function renderCloudTab() {
  const body = document.getElementById("cloud-view");
  body.innerHTML = "<small>聚合中…（jieba 分词，首次略慢）</small>";
  const scope = currentCat ? "?category_id=" + encodeURIComponent(currentCat) : "";
  const data = await (await fetch("/api/cloud" + scope)).json();
  const focusName = (data.focus && data.focus.name) || "全库";
  const max = data.words.length ? Math.max(...data.words.map(w => w.count)) : 1;
  let html = `<div class="cloud-scope">范围：<b>${focusName}</b>`
    + (currentCat ? ` <a href="#" id="cloud-all">↩ 全库</a>` : "")
    + ` <span style="opacity:.55">（样本 ${data.sampled_entries} 条；点分类词元进入子分类，点内容词元按词过滤）</span></div>`;
  html += `<div class="cloud-cats">` + (data.categories.length
    ? data.categories.map(c =>
        `<button class="cloud-cat" data-id="${c.id}" data-name="${c.name}"
          title="进入子分类「${c.name}」（${c.count} 条可消费）">${c.name}（${c.count}）</button>`).join("")
    : "<small style=\"opacity:.6\">该范围无下级分类。</small>") + `</div>`;
  html += `<div class="cloud-words">` + (data.words.length
    ? data.words.map(w => {
        const size = (13 + 22 * Math.sqrt(w.count / max)).toFixed(1);
        const tip = `${w.word}：${w.count} 条` + (w.top ? `，主导分类：${w.top.name}` : "");
        return `<span class="cloud-word" data-word="${w.word}" style="font-size:${size}px;color:${w.color}"
          title="${tip}">${w.word}</span>`;
      }).join("")
    : "<small style=\"opacity:.6\">无内容词元（该范围无可消费正文，或 jieba 未装）。</small>") + `</div>`;
  html += `<div id="cloud-facet"></div>`;
  body.innerHTML = html;
  // 分类词元：进入子分类 + 联动分类树（选中态同步、滚动定位闪烁）
  body.querySelectorAll(".cloud-cat").forEach(b => b.onclick = () => {
    currentCat = b.dataset.id;
    cloudWord = null;
    loadTree();
    highlightInTree(b.dataset.id);
    renderCloudTab();
  });
  const all = document.getElementById("cloud-all");
  if (all) all.onclick = (e) => { e.preventDefault(); currentCat = null; cloudWord = null; loadTree(); renderCloudTab(); };
  // 内容词元：facet 过滤当前范围
  body.querySelectorAll(".cloud-word").forEach(s => s.onclick = async () => {
    cloudWord = s.dataset.word;
    const q2 = (currentCat ? "?category_id=" + encodeURIComponent(currentCat) : "?")
      + (currentCat ? "&" : "") + "word=" + encodeURIComponent(cloudWord);
    const d2 = await (await fetch("/api/cloud" + q2)).json();
    const facet = document.getElementById("cloud-facet");
    if (!facet) return;
    facet.innerHTML = `<div style="font-size:13px;margin:6px 0">范围「${(d2.focus && d2.focus.name) || "全库"}」
      含「<b>${cloudWord}</b>」的可消费条目 ${d2.entries.length} 条：</div>`
      + (d2.entries.length ? d2.entries.map(x =>
          `<div class="entry" data-id="${x.id}"><a href="${x.locator}" target="_blank" rel="noopener">${x.title}</a>`
          + `<span class="badge">${srcLabel(x.source_type)}</span>`
          + `<button class="move-btn" data-id="${x.id}" data-title="${x.title.replace(/"/g, "&quot;")}">⇄改分类</button>`
          + `<button class="reject-btn" data-id="${x.id}" data-title="${x.title.replace(/"/g, "&quot;")}">🚫舍弃</button>`
          + (x.snippet ? `<br><small>${x.snippet}</small>` : "") + `</div>`).join("")
        : "<small>无匹配。</small>");
    bindEntryButtons();
  });
}

// ---- 时间线视图（第四十四批：scoped timeline + 陈旧分支提醒） ----
// 范围 = 左侧树当前焦点分类子树（currentCat；null=全库），随焦点切换；
// 时间轴走 created_at（内容时间）；created_at 缺失只计数不编造时间；
// 柱点击 → 该桶条目下钻；陈旧分支 = 叶子分类超 N 年无新内容（只提醒不删，
// 清理/归档走左侧树管理按钮）。
let tlGranPref = null;   // 用户显式粒度偏好（null=自适应；切焦点后保留）
let tlChart = null;      // ECharts 实例（重渲染前 dispose）
async function renderTimelineTab() {
  const body = document.getElementById("timeline-view");
  body.innerHTML = "<small>聚合中…</small>";
  const params = new URLSearchParams();
  if (currentCat) params.set("category_id", currentCat);
  if (tlGranPref) params.set("granularity", tlGranPref);
  const qs = params.toString();
  const data = await (await fetch("/api/timeline" + (qs ? "?" + qs : ""))).json();
  const focusName = (data.focus && data.focus.name) || "全库";
  let html = `<div class="tl-scope">范围：<b>${focusName}</b>`
    + (currentCat ? ` <a href="#" id="tl-all">↩ 全库</a>` : "")
    + ` · 粒度：<button class="tl-gran${data.granularity === "year" ? " on" : ""}" data-gran="year">年</button>`
    + `<button class="tl-gran${data.granularity === "month" ? " on" : ""}" data-gran="month">月</button>`
    + (data.unknown_count
        ? ` · <span title="created_at 缺失（folder 源等）：只计数，不编造时间">时间未知 ${data.unknown_count} 条</span>` : "")
    + `</div>`;
  html += `<div id="tl-chart"></div><div id="tl-bucket"></div>`;
  // 陈旧分支提醒（只提醒不改数据）
  const sb = data.stale_branches || [], ub = data.unknown_branches || [];
  html += `<div class="tl-stale"><b>🕰️ 陈旧分支提醒</b>`
    + `<span style="opacity:.55">（叶子分类超 ${data.threshold_years} 年无新内容——仅提醒，清理/归档走左侧树管理按钮）</span>`
    + (sb.length ? `<div>` + sb.map(b =>
        `<div class="tl-branch"><span class="nm">${b.name}</span>`
        + `<span class="age">停滞 ${b.age_years} 年</span>`
        + `<span style="opacity:.6">最新条目 ${(b.latest || "").slice(0, 10)} · ${b.count} 条</span>`
        + `<button class="tl-locate" data-id="${b.id}" data-name="${b.name}">📍 树中定位</button>`
        + `</div>`).join("") + `</div>`
      : `<div><small style="opacity:.6">无陈旧分支（该范围叶子分支均有 ${data.threshold_years} 年内新内容）。</small></div>`)
    + (ub.length ? `<div><small style="opacity:.55">另有 ${ub.length} 个分支时间未知（created_at 缺失，不判陈旧）：`
        + ub.slice(0, 8).map(b => b.name).join("、") + (ub.length > 8 ? "…" : "") + `</small></div>` : "")
    + `</div>`;
  body.innerHTML = html;
  // 粒度切换（显式偏好，切焦点后保留）
  body.querySelectorAll(".tl-gran").forEach(b => b.onclick = () => {
    tlGranPref = (tlGranPref === b.dataset.gran) ? null : b.dataset.gran;
    renderTimelineTab();
  });
  const all = document.getElementById("tl-all");
  if (all) all.onclick = (e) => { e.preventDefault(); currentCat = null; loadTree(); renderTimelineTab(); };
  // ECharts 柱状图（复用 vendored echarts，与 graph.html 同源）
  const box = document.getElementById("tl-chart");
  if (tlChart) { tlChart.dispose(); tlChart = null; }
  if (data.buckets.length && typeof echarts !== "undefined") {
    tlChart = echarts.init(box);
    tlChart.setOption({
      tooltip: { trigger: "axis" },
      grid: { left: 44, right: 12, top: 20, bottom: 28 },
      xAxis: { type: "category", data: data.buckets.map(b => b.label) },
      yAxis: { type: "value", minInterval: 1 },
      series: [{ type: "bar", data: data.buckets.map(b => b.count),
                 itemStyle: { color: "#3f6fb5" }, barMaxWidth: 36 }],
    });
    tlChart.on("click", p => drillBucket(data.buckets[p.dataIndex].key));
  } else if (!data.buckets.length) {
    box.innerHTML = "<small style=\"opacity:.6\">该范围无带内容时间的条目。</small>";
  }
  // 陈旧分支：树中定位（与词云分类词元同款联动）
  body.querySelectorAll(".tl-locate").forEach(b => b.onclick = () => {
    currentCat = b.dataset.id;
    loadTree();
    highlightInTree(b.dataset.id);
  });
}

async function drillBucket(key) {

  box.innerHTML = `<div style="font-size:13px;margin:6px 0">「<b>${key}</b>」的可消费条目 ${d.entries.length} 条：</div>`
    + (d.entries.length ? d.entries.map(x =>
        `<div class="entry" data-id="${x.id}"><a href="${x.locator}" target="_blank" rel="noopener">${x.title}</a>`
        + `<span class="badge">${srcLabel(x.source_type)}</span>`
        + `<button class="move-btn" data-id="${x.id}" data-title="${x.title.replace(/"/g, "&quot;")}">⇄改分类</button>`
        + `<button class="reject-btn" data-id="${x.id}" data-title="${x.title.replace(/"/g, "&quot;")}">🚫舍弃</button>`

function entryCard(e) {
  return `<div class="entry" data-id="${e.id}"><a href="${e.locator}" target="_blank" rel="noopener">${e.title}</a>`
    + e.channels.map(ch => `<span class="badge" title="关联解释：${ch.replace(/"/g, "&quot;")}">${chLabel(ch)}</span>`).join("")
    + `<button class="wb-focus-btn" data-id="${e.id}" title="以该条目为焦点进入放射视图">🎯 放射</button>`
    + (e.snippet ? `<br><small>${e.snippet}</small>` : "")
    + `</div>`;
}

const SIG_TITLE = { word: "成员共享词（组内每条正文均可验证，非人工命名）",
                    category: "成员共享分类（组内每条都挂接）",
                    host: "成员共享站点（组内每条同源）" };

function renderAggTab() {
  const body = document.getElementById("wb-body");
  if (!wb.merged.length) {
    body.innerHTML = "<small>无命中——换个关键词试试（聚合 = 全文检索 ∪ 语义相似 ∪ 主题多路召回）。</small>";
    return;
  }
  let html = "";
  if (wb.groups && wb.groups.length) {
    // 集分组列表（第六十批，§7.3）：组头信号非人工命名，点组内条目即下钻
    const note = wb.gmode === "semantic"
      ? "语义聚类（sim 通道，阈值 0.72）" : "主分类 + 同站点";
    html += `<small class="set-note">命中较多——先看「知识集」分组（${note}；组头 = 成员自身信号，非人工命名）：</small>`;
    for (const g of wb.groups) {
      html += `<div class="set-group"><div class="set-head">`
        + g.signals.map(s =>
            `<span class="badge sig-${s.kind}" title="${SIG_TITLE[s.kind] || s.kind}">${s.value}</span>`).join("")
        + `<span class="badge">${g.size} 条</span></div>`
        + (g.excerpt ? `<div class="set-excerpt" title="代表条目：${(g.excerpt_title || "").replace(/"/g, "&quot;")}">「${g.excerpt}」</div>` : "")
        + g.entries.map(entryCard).join("")
        + `</div>`;
    }
    if (wb.singles && wb.singles.length)
      html += `<div class="set-group"><div class="set-head"><span class="badge">未成组</span>`
        + `<span class="badge">${wb.singles.length} 条</span></div>`
        + wb.singles.map(entryCard).join("") + `</div>`;
  } else {
    html = wb.merged.map(entryCard).join("");
  }
  body.innerHTML = html;
  body.querySelectorAll(".wb-focus-btn").forEach(b =>
    b.onclick = () => { wb.focusId = b.dataset.id; wb.tab = "radiate"; renderWorkbench(); });
  attachCatChips();  // 分类定位徽标
  bindEntryButtons();
}

async function renderThreadsTab() {
  const body = document.getElementById("wb-body");
  if (!wb.merged.length) { body.innerHTML = "<small>无命中，无线索可聚合。</small>"; return; }
  body.innerHTML = "<small>聚合中…</small>";
  const ids = wb.merged.map(x => x.id);
  const data = await (await fetch("/api/threads-lookup?ids=" + encodeURIComponent(ids.join(",")))).json();
  const agg = new Map();  // thread_id → {name, count}
  for (const ts of Object.values(data.map || {}))
    for (const t of ts) {
      const ex = agg.get(t.id) || { name: t.name, count: 0 };
      ex.count += 1; agg.set(t.id, ex);
    }
  body.innerHTML = agg.size
    ? [...agg.entries()].map(([tid, t]) =>
        `<div class="entry"><a href="#" class="thread-open" data-tid="${tid}">🧵 ${t.name}</a>`
        + `<span class="badge">含当前结果 ${t.count} 条</span></div>`).join("")
    : `<small>当前 ${wb.merged.length} 条结果都不在线索里——点右上「🧵 固化为线索」把这次探索沉淀下来。</small>`;
  body.querySelectorAll(".thread-open").forEach(a =>
    a.onclick = (e) => { e.preventDefault(); openThread(a.dataset.tid); });
}

async function renderRadiateTab() {
  const body = document.getElementById("wb-body");
  if (!wb.merged.length) { body.innerHTML = "<small>无命中，无焦点可放射。</small>"; return; }
  if (!wb.focusId || !wb.merged.some(x => x.id === wb.focusId))
    wb.focusId = wb.merged[0].id;
  body.innerHTML = "<small>放射中…</small>";
  const r = await fetch(`/api/graph/radiate?node_id=e:${wb.focusId}&per_channel=12`);
  if (r.status === 404) { body.innerHTML = "<small>焦点条目不存在（可能已舍弃）。</small>"; return; }
  const data = await r.json();
  if (!data.nodes.length) {
    body.innerHTML = `<div class="wb-radiate-focus">🎯 焦点：${data.focus.name}</div>`
      + `<small>该条目没有可放射的邻域（无挂接/同源/同线索关联）。<a href="#" id="wb-open-graph">去关系图总览</a></small>`;
    document.getElementById("wb-open-graph").onclick =
      (e) => { e.preventDefault(); openGraph(); };
    return;
  }
  // 按主通道分组；通道顺序固定，可读优先
  const ORDER = ["attach:", "same_host:", "thread:", "child:", "parent:", "host_member:"];
  const groups = {};
  for (const n of data.nodes) {
    const ch = (n.reasons && n.reasons[0]) || "";
    const key = ORDER.find(o => ch.startsWith(o)) || ch || "其他";
    (groups[key] = groups[key] || []).push(n);
  }
  const chTitle = key => chLabel(key.replace(/:$/, ""));
  body.innerHTML =
    `<div class="wb-radiate-focus">🎯 焦点：${data.focus.name}`
    + `　<a href="#" id="wb-open-graph">🕸️ 在图中打开</a></div>`
    + Object.keys(groups).map(key =>
        `<div class="wb-channel">${chTitle(key)}（${groups[key].length}${data.truncated && data.truncated[key.replace(":", "")] ? `，还有 ${data.truncated[key.replace(":", "")]} 条未显示` : ""}）</div>`
        + groups[key].map(n =>
            `<div class="entry"><a href="${n.locator || "#"}" target="_blank" rel="noopener">${n.name}</a>`
            + `<span class="badge" title="关联解释">${n.reasons.map(chLabel).join("；")}</span>`
            + (n.kind === "entry" ? `<button class="wb-focus-btn" data-eid="${n.id.slice(2)}" title="以该条目为新焦点继续放射">🎯 切焦点</button>` : "")
            + `</div>`).join("")).join("");
  document.getElementById("wb-open-graph").onclick =
    (e) => { e.preventDefault(); openGraph("e:" + wb.focusId); };
  body.querySelectorAll(".wb-focus-btn").forEach(b =>
    b.onclick = () => { wb.focusId = b.dataset.eid; renderRadiateTab(); });
}

// ---- 管理页（第五十九批：六视图页签之六，集中暂存/待清理/失效/时效/已舍弃/数据管理）----

      (async () => { for (const id of ids) await writeJSON(`/api/entries/${id}/reject`, {}); refreshCurrent(); })();

async function mgmtDead() {
  refreshCurrent = () => mgmtShow("dead");
  _mgmtDesc().textContent = "404/410 = 永久消失；error = 疑似临时故障，可重测（CLI：kcheck）。";
  const data = await (await fetch("/api/dead-links")).json();
  const body = _mgmtBody();
  const row = (x, tag, code) =>
    `<div class="entry" data-id="${x.id}"><a href="${x.locator}" target="_blank" rel="noopener">${x.title}</a>`
    + `<span class="badge">${tag}${x.code ? " " + x.code : ""}</span>`
    + `<button class="reject-btn" data-id="${x.id}" data-title="${x.title.replace(/"/g, "&quot;")}">🚫舍弃</button></div>`;
  const all = [...data.dead.map(x => row(x, "失效", x.code)),
               ...data.error.map(x => row(x, "疑似临时", x.code))];
  body.innerHTML = all.length ? all.join("")
    : "<small>没有失效链接。用 CLI 跑体检：uv run python -m knowatlas kcheck</small>";
  bindEntryButtons();
  const rejectMany = async (ids) => {
    for (const id of ids) await writeJSON(`/api/entries/${id}/reject`, {});
    refreshCurrent();
  };
  if (data.dead.length)
    body.insertAdjacentHTML("beforeend",
      `<button id="reject-all-dead" style="margin-top:12px;padding:6px 14px;cursor:pointer">🚫 一键舍弃全部 ${data.dead.length} 条失效链接</button>`);
  document.getElementById("reject-all-dead")?.addEventListener("click",
    () => { if (confirm(`确认舍弃全部 ${data.dead.length} 条失效链接？（可在已舍弃里找回）`))
      rejectMany(data.dead.map(x => x.id)); });
}

async function mgmtFresh() {
  refreshCurrent = () => mgmtShow("fresh");
  _mgmtDesc().textContent = "规则判为「过期或疑似过旧」（废弃关键词/正文日期过旧/同主题已有更新版本）。仅标记，由你决定。";
  const data = await (await fetch("/api/freshness")).json();
  const reasonLabel = { keyword: "废弃关键词", date_old: "日期过旧", newer_version: "有更新版本" };
  const flagLabel = { stale: "明确过期", suspect: "疑似过旧" };
  const rows = [...data.stale.map(x => ({...x, flag: "stale"})),
                ...data.suspect.map(x => ({...x, flag: "suspect"}))];
  const body = _mgmtBody();
  body.innerHTML = rows.length
    ? rows.map(x =>
        `<div class="entry" data-id="${x.id}"><a href="${x.locator}" target="_blank" rel="noopener">${x.title}</a>`
        + `<span class="badge">${srcLabel(x.source_type)}</span>`
        + `<span class="badge">${flagLabel[x.flag] || x.flag}</span>`
        + (x.reason ? `<span class="badge" title="时效规则判定：${x.reason}">${reasonLabel[x.reason] || x.reason}</span>` : "")
        + `<button class="reject-btn" data-id="${x.id}" data-title="${x.title.replace(/"/g, "&quot;")}">🚫舍弃</button>`
        + `<button class="keep-btn" data-id="${x.id}">↩不过时，保留</button></div>`).join("")
    : "<small>没有时效候选。跑一次 ksync --freshness-scan（纯规则、零费用）。</small>";
  bindEntryButtons();
  document.querySelectorAll(".keep-btn").forEach(b => b.onclick = async () => {
    // 保留：置 freshness_flag=ok（之后规则不再标记它；保留动作记录在 task_log）
    await writeJSON(`/api/entries/${b.dataset.id}/unflag-freshness`, {});
    refreshCurrent();
  });
  const ids = rows.map(x => x.id);
  if (ids.length)
    body.insertAdjacentHTML("beforeend",
      `<button id="reject-all-fresh" style="margin-top:12px;padding:6px 14px;cursor:pointer">🚫 一键舍弃全部 ${ids.length} 条候选</button>`);
  document.getElementById("reject-all-fresh")?.addEventListener("click",
    () => { if (confirm(`确认舍弃全部 ${ids.length} 条候选？（可在已舍弃里找回）`)) {
      (async () => { for (const id of ids) await writeJSON(`/api/entries/${id}/reject`, {}); refreshCurrent(); })();
    } });
}

async function mgmtRejected() {
  refreshCurrent = () => mgmtShow("rejected");
  _mgmtDesc().textContent = "恢复后重新参与分类与检索。";
  const data = await (await fetch("/api/rejected")).json();
  const body = _mgmtBody();
  body.innerHTML = data.entries.length
    ? data.entries.map(x =>
        `<div class="entry" data-id="${x.id}"><a href="${x.locator}" target="_blank" rel="noopener">${x.title}</a>`
        + `<span class="badge">${srcLabel(x.source_type)}</span>`
        + `<button class="restore-btn" data-id="${x.id}">↩恢复</button></div>`).join("")
    : "<small>没有已舍弃的条目。</small>";
  document.querySelectorAll(".restore-btn").forEach(b => b.onclick = async () => {
    await writeJSON(`/api/entries/${b.dataset.id}/restore`, {});
    refreshCurrent();
  });
}

async function mgmtData() {
  refreshCurrent = () => mgmtShow("data");
  _mgmtDesc().textContent = "采集 / 清理入口与各源配置状态（改配置：config/knowatlas.toml）。";
  const body = _mgmtBody();
  body.innerHTML = "<small>载入中…</small>";
  const [src, stats] = await Promise.all([
    fetch("/api/sources").then(r => r.json()).catch(() => ({ sources: [] })),
    fetch("/api/stats").then(r => r.json()).catch(() => ({})),
  ]);
  const bs = stats.by_source || {};
  let html = `<div style="margin:4px 0 14px"><button id="open-ingest" style="cursor:pointer;padding:6px 14px">＋ 收录网页</button>`
    + `<span style="font-size:12px;color:#888;margin-left:10px">或用左缘 📮 小书签（悬停展开，拖到书签栏）</span></div>`;
  html += `<div class="wb-channel">库内条目（按来源）</div><div style="margin-bottom:12px">`
    + (Object.keys(bs).length
        ? Object.entries(bs).map(([k, v]) => `<span class="badge">${srcLabel(k)} ${v}</span>`).join(" ")
        : "<small>无条目</small>")
    + (stats.uncategorized !== undefined ? ` <span class="badge">未分类 ${stats.uncategorized}</span>` : "")
    + (stats.archived !== undefined ? ` <span class="badge">归档 ${stats.archived}</span>` : "")
    + (stats.contents !== undefined ? ` <span class="badge">正文块 ${stats.contents}</span>` : "")
    + `</div>`;
  const runs = stats.recent_runs || [];
  if (runs.length) {
    html += `<div class="wb-channel">最近任务</div><div style="margin-bottom:12px">`
      + runs.map(r => `<span class="badge" title="${(r.started_at || "").replace(/"/g, "&quot;")}">${r.kind || "?"}</span>`).join(" ")
      + `</div>`;
  }
  html += `<div class="wb-channel">源配置状态</div><div>`
    + (src.sources || []).map(s =>
        `<span class="badge" style="${s.configured ? "" : "opacity:.55"}" title="config [sources.${s.name}] ${s.configured ? "已配置" : "未配置"}">${s.label} ${s.configured ? "✓" : "—"}</span>`).join(" ")
    + `</div>`;
  body.innerHTML = html;
  document.getElementById("open-ingest").onclick = () => openIngest();
}

function mgmtShow(sub) {
  mgmtCurrent = sub;
  document.querySelectorAll("#mgmt-tabs .mtab").forEach(b =>
    b.classList.toggle("on", b.dataset.sub === sub));
  if (sub === "staged") mgmtStaged();
  else if (sub === "nonk") mgmtNonk();
  else if (sub === "dead") mgmtDead();
  else if (sub === "fresh") mgmtFresh();
  else if (sub === "rejected") mgmtRejected();
  else mgmtData();
}
document.querySelectorAll("#mgmt-tabs .mtab").forEach(b =>
  b.onclick = () => mgmtShow(b.dataset.sub));

// 设置：显示空分类（原侧栏选项，第五十九批移入顶栏 ⚙）
const _emptyCb = document.getElementById("show-empty-cats");
_emptyCb.checked = showEmptyCats;
_emptyCb.onchange = (e) => {
  showEmptyCats = e.target.checked;
  localStorage.setItem("knowatlas-show-empty", showEmptyCats ? "1" : "0");
  loadTree();
};

// bookmarklet 落地接收（第 49 批）：?add=<url> → 打开收录对话框、填入 URL、
// 自动提交（复用同一条链路与结果展示）。只收 http(s)；先清掉 query 参数防刷新重发。
const _addQ = new URLSearchParams(location.search).get("add") || "";
const _addOk = /^https?:\/\//i.test(_addQ);
if (_addOk) {
  history.replaceState(null, "", location.pathname);
  openIngest(_addQ);
}

// 左栏折叠（第五十八批纪律保留，第五十九批折叠键上移顶栏）：默认收起
// （知识窗口优先，用户定调），偏好记 localStorage「knowatlas-side」；[
// 快捷键切换（输入框聚焦时不触发）。页签化后搜索常驻顶栏，58 批的悬浮
// 镜像条不再需要。
const _sideBtn = document.getElementById("side-collapse");
function sideApply(hide) {
  document.body.classList.toggle("side-hide", hide);
  _sideBtn.textContent = hide ? "▶" : "◀";
  _sideBtn.title = hide ? "展开左栏（快捷键 [ ）" : "收起左栏（快捷键 [ ）";
  localStorage.setItem("knowatlas-side", hide ? "hide" : "show");
}
function sideToggle() {
  sideApply(!document.body.classList.contains("side-hide"));
}
_sideBtn.onclick = sideToggle;
document.addEventListener("keydown", e => {
  if (e.key === "[" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)
      && !document.activeElement.isContentEditable) sideToggle();
});
sideApply(localStorage.getItem("knowatlas-side") !== "show");  // 默认收起；显式展开过的用户保持

// 先取同源写凭据（服务端种 HttpOnly Cookie），再加载数据——用户无需手工填令牌
ensureSession().then(() => {
  loadTree();
  if (_addOk) document.getElementById("add-url-btn").click();
});
</script>
</body>
</html>
